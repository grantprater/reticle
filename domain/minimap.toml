[self-audio-circle]
claim = """
The minimap draws a pale, white-tinted circle round the self icon, which the
player calls the self audio circle. It is drawn for the player's own icon
only: not round teammates, and not round a spectated player. It marks the
player's own sounds, footsteps and reloads, not movement. The player's own
shots at 4f207c0c4e39 901.0-902.5 s and 1120.9-1122.9 s drew none, and moving
without a footstep sound draws none [domain:abilities/silent-stepping]. The
footstep circle's radius is the audio range, which equals the spike's
explosion radius; whether the spike's explosion is itself drawn on the
minimap is a separate, uncertain belief
[domain:minimap/spike-explosion-drawn-belief].

The circle follows the self icon: its centre is the icon's, not the place a
sound was made. Its audio range is the same in-game distance on every map,
and its drawn size is set by the minimap's map-scaling setting, which is
separate from the widget's size [domain:capture/minimap-size-settings]. So a
radius in px holds for one map at one scaling and predicts nothing in px on
another: [metric:audio_circle/per-frame@4f207c0c4e39#large_r_median=74.86] px on the Split capture below and
[metric:audio_circle/radius-38-56@5822b6646448#r_baked=108.45] px on Lotus 5822b6646448 are one range at
two scales.

A reload draws a smaller circle while no footstep sounds, and a footstep's
circle supersedes it, so the two sizes alternate when steps and a reload
overlap. That a reload's audio range is smaller than a footstep's is the
player's inference from the drawing, a belief.

Observed on 4f207c0c4e39 (`C:\\Users\\grant\\Videos\\2026-09-27 19-40-58.mp4`,
Split widget, 331 baked px) by per-frame fits (`prototypes/audio_circle.py
score --per-frame`): the footstep circle measures [metric:audio_circle/per-frame@4f207c0c4e39#large_r_median=74.86] px (sd
[metric:audio_circle/per-frame@4f207c0c4e39#large_r_sd=0.16], [metric:audio_circle/per-frame@4f207c0c4e39#large_fits=1793] frames), the one size the player knew before
2026-09-30 and names the spike radius. Within a run it neither grows nor
shrinks as it fades (median change
[metric:audio_circle/per-frame@4f207c0c4e39#run_abs_last_minus_second_median=0.09] px).

The reload circle measures [metric:audio_circle/per-frame@4f207c0c4e39#small_r_median=69.14] px (sd [metric:audio_circle/per-frame@4f207c0c4e39#small_r_sd=0.43]) in
[metric:audio_circle/per-frame@4f207c0c4e39#small_fits=41] frames over [metric:audio_circle/per-frame@4f207c0c4e39#small_runs=9] runs, at 891.80-892.37, 893.30-893.50,
903.80-904.57, 905.22-905.30, 1037.70, 1201.55-1201.77, 1210.70-1210.92,
1211.45-1211.60 and 2057.25-2057.42 s. At 903.8-904.6 s the player was
reloading or changing guns (see source), and the circle alternates with the
footstep circle from one 15 Hz frame to the next
([metric:audio_circle/per-frame@4f207c0c4e39#span_902_906_r_min=68.82]-[metric:audio_circle/per-frame@4f207c0c4e39#span_902_906_r_max=75.08] px over 902-906 s). Every small fit lies within 2.5 s
of a HUD magazine refill ([metric:audio_circle/per-frame@4f207c0c4e39#small_fits_within_2_5s_of_refill=41] of [metric:audio_circle/per-frame@4f207c0c4e39#small_fits=41]); [metric:audio_circle/per-frame@4f207c0c4e39#refills_with_small=6] of
[metric:audio_circle/per-frame@4f207c0c4e39#refills=17] own-view refills show it, against [metric:audio_circle/per-frame@4f207c0c4e39#refill_control_with_small=0] of
[metric:audio_circle/per-frame@4f207c0c4e39#refill_control_windows=218] refill-free control windows. Refills with no own footstep
detected in the sound bank show it [metric:audio_circle/per-frame@4f207c0c4e39#refills_no_footstep_small=4] of [metric:audio_circle/per-frame@4f207c0c4e39#refills_no_footstep=8], and
refills with one [metric:audio_circle/per-frame@4f207c0c4e39#refills_footstep_small=2] of [metric:audio_circle/per-frame@4f207c0c4e39#refills_footstep=9]; the bank misnames many
match sounds, so that split is weak.
"""
kind = "appearance"
known = "player"
since = "2026-09-29"
subject = "minimap:self-icon"
