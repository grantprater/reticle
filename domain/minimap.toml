# The minimap widget: what it draws, when, and what it looks like.
# Schema and the citation form: reticle/domain.py.

[vision-gate]
claim = """
Own-team icons are always drawn. Enemy-team entities are drawn only inside team
vision, and a reveal shows PLAYERS ONLY -- not the spike, not abilities.
"""
kind = "rule"
known = "player"
since = "2026-09-10"
use = "the DRAWN light in lighting.py, never the raycast"
exceptions = """
a reveal ability shows an enemy with no sight of them, and an enemy-owned
entity stays drawn for a brief period AFTER leaving vision --
[domain:minimap/vision-trailing-persistence]. So the gate is not concurrent
and it is not exceptionless.
"""
see = ["minimap/vision-trailing-persistence"]
phrases = ["reveal shows players only", "a reveal shows PLAYERS ONLY"]

[transparency]
claim = """
The widget is semi-transparent over the void, so the live world bleeds through
wherever the map art is absent. Search inside the OPAQUE structure only.
"""
kind = "rule"
known = "observed"
since = "2026-08-20"
use = "slab_mask in reticle/minimap.py; every reader masks to the opaque floor slab"
source = "the documented cause of reading scenery as icons"

[fit-not-repair]
claim = """
Fit a shape rather than repairing one with a closing radius. A broken arc is
evidence about coverage, and closing it destroys the evidence.
"""
kind = "constraint"
known = "measured"
since = "2026-08-28"
source = """
prototypes/minimap_ring_fit.py, promoted into reticle/minimap.py 2026-09-06 by
deletion plus re-export: it fits a circle by CIRCUMFERENCE COVERAGE, and with
the radius range open to 6 the fit collapsed to r=6 on nearly every chroma miss
"""
use = "circumference coverage in reticle/minimap.py, which tolerates a broken arc"
depends_on = ["capture/chroma-420"]

[coincident-icons]
claim = """
Two icons may be EXACTLY coincident, so no rule may assume they separate. The
widget cannot resolve two players who touch, and it draws one above another on a
different level at the same point.
"""
kind = "constraint"
known = "measured"
since = "2026-09-09"
source = "read self-ally pairs come as close as 0.7 px"
phrases = ["exactly coincident"]

[spike-glyph]
claim = """
The spike glyph is a rounded equilateral triangle with a thin black outline, a
black dot inside a BLACK CIRCLE, and three dots toward the corners.
"""
kind = "appearance"
known = "player"
since = "2026-09-10"
use = """
that black circle is why a ring fit accepts the spike -- it really is a keyed
annulus around a dark interior, so every 'fit the ring better' proposal is dead
"""

[spike-inversion]
claim = """
The spike glyph inverts on pickup: base down on the ground, base up when
carried, in one frame, unboundedly many times a round.
"""
kind = "appearance"
known = "player"
since = "2026-09-10"
see = ["minimap/spike-glyph"]
phrases = ["inverts on pickup"]

[spike-carrier-overlay]
claim = """
A teammate's carried spike draws on the minimap at the lower left of that
teammate's icon, over it, inverted relative to the spike dropped on the map.
The roster marks the same teammate.
"""
kind = "appearance"
known = "player"
since = "2026-09-28"
use = """
a carried glyph belongs to the icon above and to its right, so a fit nearer the
glyph than that icon is the glyph (`spike.on_glyph`), and the roster marker and
the minimap glyph witness the same carrier
"""
see = ["minimap/spike-glyph", "minimap/spike-inversion", "hud/spike-carrier-marker"]
phrases = ["lower left of their icon", "carried spike overlay"]

[no-spike-channel]
claim = """
Until `reticle/spike.py` (2026-09-28) no channel read the spike. It was
therefore invisible to every test that gates on a read confuser, which is why a
spike-shaped wrong accept survived one; the self and ally fits now ask
`spike.on_glyph`.
"""
kind = "constraint"
known = "measured"
since = "2026-09-10"
source = "3 of 9 spike cases sit in the `clear` stratum of the self-fit labelling"
see = ["minimap/spike-glyph"]

[icon-residual-is-a-ring]
claim = """
In a lighting-band residual an icon is a ragged RING, not a disc: its mid-grey
interior falls INSIDE the band and contributes nothing, so the icon supplies its
edges and encloses a hole.
"""
kind = "appearance"
known = "measured"
since = "2026-09-10"
source = "prototypes/proposal_audit.py, all 14 audited acquisition misses"
use = """
fill the enclosed holes before any distance transform; on the raw mask peak dt
under a matched icon and a missed one are the same 2-3 px
"""

[icon-welding]
claim = """
An icon's residual is routinely WELDED through a 1-2 px neck to something with
extent -- a viewcone, a trapwire line, a neighbouring icon, or bright map
structure -- so an area gate rejects the icon for its neighbour's size.
"""
kind = "appearance"
known = "measured"
since = "2026-09-10"
source = "12 of 14 audited misses; prototypes/proposal_audit.py"
see = ["minimap/icon-residual-is-a-ring"]

[icon-extent-by-family]
claim = """
On the reference widget the drawn families separate by SIZE: a player icon is
13 px across at the median, an ability icon 24, a region 27. Player and ability
therefore need one band between them, and a region's extent overlaps an
ability's.
"""
kind = "geometry"
known = "measured"
since = "2026-09-10"
source = """
831 human minimap_dynamic rows over a06f04a0059f, 5822b6646448 and
c62c2b06bcfb, all widget width 465; box extent, not the rows' own area, which
came from a different proposer. Confirmed independently by rendering all 11
a06f04a0059f painted icons at 5x against reference circles: an r=12 circle sits
on the sonic sensor's disc edge, which is the same 24 px across
"""
use = """
scale by widget_scale before comparing; an area cap of 400 reference px is a
disc only 22.6 px across and sits BELOW the ability median
"""
exceptions = """
the labelled boxes are RIGHT-CENSORED at 40 px, so this bounds the families
from below and says nothing about the top of the ability tail
"""

[vision-trailing-persistence]
claim = """
An enemy-owned entity does not vanish the instant it leaves vision. It stays
drawn NORMALLY for a brief period after exiting the cone, before it becomes a
last-known marker. So being drawn means our team saw it recently, not that they
see it now.
"""
kind = "rule"
known = "player"
since = "2026-09-10"
use = """
any gate on concurrent light must allow this lag or it refuses true detections;
the duration is UNMEASURED, so no reader may assume a value -- and an entity's
interval must not be ended at the frame it leaves the collective viewcone
"""
exceptions = """
UNMEASURED, three ways, and each is null with a reason rather than a guess: the
duration; whether enemy-owned ABILITIES persist like enemy PLAYERS, the player's
example being a player; and what the terminal state is -- a question mark, a
different marker, or nothing
"""
source = """
the player, correcting the gate's exceptionless form. On 2026-09-29 (chat) the
player placed the delay he sees before an enemy's "?" here: the icon stays drawn
after the team's vision no longer covers its place, and the "?" follows
(minimap/last-known-mark-timing measures the swap as one frame)
"""
see = ["minimap/vision-gate", "minimap/last-known-mark", "minimap/last-known-mark-timing"]

[device-dim-on-deactivation]
claim = """
A deployed device DIMS when it deactivates. It is still drawn and still where it
was placed, and has merely stopped being live -- so the class is bimodal in
brightness, with an empty gap between the two modes.
"""
kind = "appearance"
known = "player"
since = "2026-09-09"
source = """
71 labelled deadlock:sonic sensor positions: dim n=24 contrast 122-175 median
137, live n=47 contrast 231-241 median 237, the largest gap 56 grey levels with
NOTHING in it. Owner death is one cause and is corroborated on an independent
channel by prototypes/device_deactivation.py, pooled p=0.002 over 73 devices
"""
use = """
never read dimming as an ENDING -- Killjoy's devices deactivate out of her
activation radius and come back, so it is reversible. Do not average a gallery
over both modes; and expect an acquisition MISS on the dim mode rather than
tuning for it
"""
exceptions = """
deadlock:barrier mesh is unimodal (223-238). That every low-contrast label is a
deactivated device is NOT established -- occlusion looks similar
"""

[dim-devices-defeat-the-residual]
claim = """
A dim device is nearly invisible to a lighting-band residual. A live sensor is
near-black on grey floor and fills solid; a dim one is mid-grey on grey floor,
so its residual is sparse speckle that hole-filling cannot close.
"""
kind = "appearance"
known = "measured"
since = "2026-09-10"
source = """
prototypes/proposal_audit.py on a06f04a0059f: the ten acquired icons sit at
median contrast 240 and hole-filled coverage 0.46, the one missed at 173 and
0.11. Distance transform under a live sensor is 6.6-10.0 px against 1.0-3.2 px
under a dim one, and core recall there caps at 54.5% at the most permissive
floor swept
"""
use = """
this is why the acquisition pool keeps `base` alongside `core`: core needs a
substantially filled disc, base's area-gated centroid survives speckle. Rank
low-contrast candidates in a retained audit channel rather than gating them out.
Whether the miss MATTERS depends on ownership --
[domain:minimap/dim-first-only-for-enemies]
"""
depends_on = ["minimap/device-dim-on-deactivation",
              "minimap/icon-residual-is-a-ring"]

[dim-first-only-for-enemies]
claim = """
A dim device can only be seen dim-FIRST if it is enemy-owned: the enemy Deadlock
was killed before the sensor ever entered team vision. An ALLY device is always
visible from the moment it is placed, so an ally device that dims was always
observed live first.
"""
kind = "rule"
known = "player"
since = "2026-09-10"
use = """
adjudication can carry an ALLY device's dim frames as missing OBSERVATIONS of a
known entity, with no dim detector at all. The enemy case is the ONLY one that
needs the dim state acquired in its own right, and it should be a FLAG rather
than a silent miss
"""
exceptions = """
the enemy case additionally requires the device to have been placed outside team
vision, since an enemy-owned entity is drawn only inside it
"""
see = ["minimap/vision-gate", "minimap/device-dim-on-deactivation"]

[enemy-death-mark]
claim = """
An enemy death leaves an X mark, and for a GUNFIRE kill both the enemy's icon
and the X are visible around the time of death -- someone had to see them to
shoot them. The mark is missing only when nobody on the team saw the victim:
killed by ally UTILITY, or fell off the map.
"""
kind = "rule"
known = "player"
since = "2026-09-10"
use = """
so enemy death LOCATION is two-sided for a gunfire kill and one-sided only for a
named, readable exception. The killfeed's weapon-icon slot is what separates
them, and it needs a BINARY -- gun against ability mark -- not the ability
template bank a full identification would cost. A gunfire entry is therefore
also a VISION WITNESS: it says a teammate saw the victim at that moment
"""
exceptions = """
ally utility and a fall narrow the position without naming it. Neither requires
anyone to have seen the victim, which is exactly why the mark can be absent
"""
supersedes = """
the prototypes/CLAUDE.md note that enemy-mark visibility is unmeasured and that
absence means nothing. Absence now means one of two named causes, and the
killfeed can tell which
"""
see = ["minimap/vision-gate"]

[ally-death-mark]
claim = """
An ally death always leaves a cyan/blue X mark on the minimap at the exact death
location, regardless of cause (gun, ability, or environmental). Ally death locations
are always observable.
"""
kind = "rule"
known = "player"
since = "2026-09-12"
use = """
Ally death locations are always observable and must never be abstained when the
minimap or player HUD is available.
"""
see = ["minimap/vision-gate", "minimap/enemy-death-mark"]

[environmental-death]
claim = """
Environmental deaths occur when an agent falls off the map (currently only on
Abyss, indicated by a falling person icon) or gets crushed by a door (currently
only on Summit).
"""
kind = "rule"
known = "player"
since = "2026-09-12"
use = """
Environmental deaths have no weapon or killer. For an ally, the death location
remains observable via the blue death mark. For an enemy, an environmental death
is unobservable unless a teammate witnessed it, in which case the death location
is explicitly abstained.
"""
see = ["minimap/enemy-death-mark"]

[widget-ring]
claim = """
The minimap widget's boundary is a circle that circumscribes the map painting.
On Ascent it touches the map at the B-site boathouse, the leftmost point, and
at A site's top-right corner.
"""
kind = "geometry"
known = "player"
since = "2026-09-24"
source = """
the player. A faint drawn ring fitted in the baked base maps sits below the ROI
centre, about (+1, +15) px on the bigmap profile and (-5, +7) px on the standard
one, because the ROI includes the location label band; its fitted radius is not
yet stable across maps.
"""
use = """
a radar mask must contain the whole map; a circle inscribed in the ROI clips map
pixels on 6 of 12 baked geometries
"""

[enemy-smokes-block-cones]
claim = """
Enemy smokes block allied viewcones on the minimap. That is their only
influence on the player's minimap: the smoke itself is not drawn.
"""
kind = "rule"
known = "player"
since = "2026-09-24"
use = """
an enemy smoke can only be inferred as missing light: floor the raycast says an
ally sees but the drawn light leaves unlit, in a smoke-sized disc
"""
see = ["abilities/enemy-smokes-not-on-minimap", "minimap/vision-gate"]

[red-portrait-states]
claim = """
A player's portrait turns red in two states, on the minimap and on the HUD
ally roster alike: KAY/O downed in his ultimate, and any player pulled into
Deadlock's ultimate (Annihilation). The red replaces the agent's own colours
for as long as the state lasts.
"""
kind = "appearance"
known = "player"
since = "2026-09-25"
use = """
a portrait read while red names no agent from its colours: the reader refuses
with that reason rather than guess. The red is evidence of its own -- a red
ally icon is KAY/O downed or an Annihilation captive, which the lineup and the
killfeed can confirm
"""
phrases = ["portrait turns red", "downed in ult"]

[skye-bird-like-ally]
claim = """
Skye's bird (Guiding Light) draws on the minimap with much of an ally portrait
icon's look, enough that an ally icon reader fits it as a teammate.
"""
kind = "appearance"
known = "player"
since = "2026-09-25"
use = """
an ally icon that moves faster than a walker or appears from Skye's position
may be her bird, not a teammate; the lineup says whether a Skye is on the side
at all, and a label of it is "not a portrait", never an agent
"""
subject = "skye:guiding-light"
phrases = ["skye bird looks like an ally"]

[cone-rays-stop-at-first-edge]
claim = """
A player's viewcone on the minimap spans a fixed angle about the direction the
icon's teardrop points. Each ray stops exactly at the first wall or box edge it
meets, corners included, with no reflection. A box edge the player stands at
blocks the player's own sight.
"""
kind = "rule"
known = "player"
since = "2026-09-28"
source = """
the player's cone spec of 2026-09-02, from watching cones on a fresh clip
(fixed angle, each ray stops at the first wall); boxes stop sight too
(2026-09-07, cone.py); on 2026-09-28 the player confirmed a box edge the player
stands at blocks the player's own sight, the ray stopping exactly at the edge
or corner. The spec's origin, the teardrop point, was withdrawn on 2026-09-28
(see minimap/cone-origin-near-centre)
"""
use = """
cone.raycast stops at the first impassable pixel; whether an origin on a
one-pixel line lies on the open side is a pose question, not a transparency one
"""
see = ["minimap/vision-gate", "minimap/cone-origin-near-centre"]

[cone-origin-near-centre]
claim = """
A player's viewcone rays start at about the centre of the player's minimap
icon (the portrait's centre), not at the teardrop's point. The player judged
this by eye; the exact origin is to be calibrated against the drawn light.
"""
kind = "appearance"
known = "player"
since = "2026-09-28"
source = """
the player on 2026-09-28, asked whether the rays start at the icon's centre or
its teardrop point after E3b of the statistical adjudicator; this replaces the
teardrop-point origin of the 2026-09-02 cone spec
"""
use = """
cast a cone from the icon's centre along the teardrop's facing; an offset from
that centre is a measured calibration (prototypes/cone_origin.py), not a game fact
"""
see = ["minimap/cone-rays-stop-at-first-edge"]

[upright-icons-on-turned-map]
claim = """
A minimap widget drawn turned 180 degrees (the side-based rotation of the Iso
capture's first half) turns the map and what points across it, not the
portraits. Agent portraits keep their on-screen orientation; each player's
facing arrow turns 180 with the map; an ability drawing that has an
orientation turns 180 with the map too. The spike glyph stays upright on the
screen, so a dropped glyph still points its base down and a carried one still
sits at the lower left of its carrier.
"""
kind = "appearance"
known = "player"
since = "2026-09-29"
source = """
the player, 2026-09-29, for the portraits, the facing arrow and the oriented
ability drawings. The spike glyph is OBSERVED, not a player answer: on the Iso
capture 4f207c0c4e39 every sampled first-half glyph points its base down on
the screen (docs/ISO_SPIKE_CARRIER.md)
"""
use = """
a reader that resamples a turned widget into the baked frame turns everything
back: the facing arrow and oriented ability drawings arrive right in the baked
frame, while the portraits and the spike glyph arrive upside down, so a
portrait score, a glyph orientation test or a glyph-to-carrier offset read
there must turn with the placement (`spike`, rotation)
"""
see = ["minimap/spike-inversion", "minimap/spike-carrier-overlay"]
phrases = ["portraits keep their on-screen orientation", "facing arrow turns with the map"]

[last-known-mark]
claim = """
An enemy's red "?" on the minimap marks the place the team last saw that
enemy. The player recalls that it comes after a delay and stays a couple of
seconds.
"""
kind = "appearance"
known = "player"
since = "2026-09-29"
source = """
the player, 2026-09-29 (chat), answering the minimap-objects questions; he
asked for the delay and the duration to be measured rather than taken from
his recollection (minimap/last-known-mark-timing measures them)
"""
use = """
a "?" is a place and a time for an enemy no one sees now; never count it as
a visible enemy, and never read it as an agent portrait
"""
see = ["minimap/vision-trailing-persistence", "minimap/last-known-mark-timing",
       "minimap/unseen-utility-death-mark"]

[last-known-mark-timing]
claim = """
The red "?" replaces the enemy's icon in the next cached frame, at the
icon's place, with no blank frame between. It holds for about 2 s, then
fades, and is gone about 3.1 s after it appeared, unless the enemy's icon
returns there first.
"""
kind = "measurement"
known = "measured"
since = "2026-09-29"
source = """
prototypes/last_known_marks.py (last-known-marks-0.1.0) on the player's 82
"?" marks of labels/minimap, 5822b6646448 and a06f04a0059f, crop cache at
15 Hz: 29 instances measured; the last icon frame precedes the "?" by
0.067-0.083 s on all 29; of the 19 that vanished the fade begins at a median
1.95 s and the mark is gone at a median 3.08 s (IQR 3.03-3.18 s); 10 ended
with the icon returning after 0.75-2.8 s. Metrics row
last_known_marks/timing@5822b6646448+a06f04a0059f; sheets in the store's
analysis/minimap-objects-b-20260929/
"""
use = """
the delay the player recalls lies before the swap, while the icon is still
drawn after vision is lost [domain:minimap/vision-trailing-persistence]; a
"?" witness expects the icon to end where the "?" begins and the "?" to be
gone within about 3.3 s
"""
exceptions = """
two sessions, one widget size (465 px); the time from leaving vision to the
swap is not measured, because the team's drawn light was not read
"""
see = ["minimap/last-known-mark"]

