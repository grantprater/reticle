cm (max [metric:replay_abilities/census#handoff_gameobject_hunter_q_sonarbolt_cm_max=1.5])
from the projectile, opening
[metric:replay_abilities/census#handoff_gameobject_hunter_q_sonarbolt_ms_median=-994.0]
ms from its close; lifetime median
[metric:replay_abilities/census#gameobject_hunter_q_sonarbolt_life_s_median=2.3]
s; [metric:replay_abilities/census#gameobject_hunter_q_sonarping_opens=69] pings
for [metric:replay_abilities/census#gameobject_hunter_q_sonarbolt_opens=41]
