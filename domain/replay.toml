[vrf-shots-from-magazine]
claim = """
A gun's magazine in a replay (`AmmoComponent.AuthResourceAmount` on the gun
actor; of its two components, the one with the most single steps, the other
being the reserve) falls by one round at a time while the gun fires, and a
fall lands on the same replay ms as the damage call of a shot that hits; the
gun's latest `Owner` reference, walked to a pawn, names the shooter. Most gun
damage calls on players have such a fall, but not all. Falls of more than one
round at once are left out as shots. Misses are inferred to be recorded,
because single-round falls far outnumber hits.
"""
kind = "measurement"
known = "measured"
since = "2026-10-07"
source = """
prototypes/execution_questions.py check over the 17 replays but the held-out
one: [metric:execution_questions/truth/check@pooled17#explained=8276] of
[metric:execution_questions/truth/check@pooled17#gun_hits=8397] gun damage
calls on players have a same-shooter single-round fall within 16 ms (the
lowest replay [metric:execution_questions/truth/check@pooled17#explained_share_min=0.9655]);
[metric:execution_questions/truth/check@pooled17#shots=45872] single-round
falls against those hits; [metric:execution_questions/truth/check@pooled17#multi_steps=206]
multi-round magazine falls skipped
"""
see = ["replay/vrf-position-stream"]

