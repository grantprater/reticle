known = "player"
since = "2026-09-24"
subject = "miks"
source = """
the player, citing the wiki. On a06f04a0059f, where Miks is an ally, every fully
observed minimap smoke reads 18.0 s with the raw_dark tracker, 1.25 s longer.
"""
