[ability-sound-phases]
claim = """
Every ability has an equip sound, heard by the local player only, and a cast
or activation sound. The equip sound is also heard while spectating the
player who equips. Some also have an ongoing sound while the ability lives
or is channelled (Hot Hands on the ground, Blaze, Regrowth looping while
channelled), and some a deactivate, end or fade-out sound (a smoke fading
out). A charge can sound too: Sova's bolts make a charging sound. An
activation can be a distinct sound from the cast: Guiding Light's bird
vanishes and the flash goes off with its own sound. The phases an ability
has, and how each sounds, are per ability.
"""
kind = "rule"
known = "player"
since = "2026-09-06"
source = """
the player, 2026-09-06 (equip separate from cast, equip self-only) and
2026-09-26 (every ability equips and casts, some deactivate, Guiding Light's
activation; ongoing sounds for Hot Hands, Blaze and channelled Regrowth);
restated 2026-09-30 while labelling the second range clip (sound_demo_20260930
labels / chat): equip, cast, channelled/ongoing and fade-out, the equip heard
for the self or a spectated player; smoke fade-out sounds and Sova's bolt
charge sound: the player, before 2026-09-30, restated 2026-09-30
"""
use = """
segment an ability's audio by phase before matching: equip, cast, ongoing and
end templates are different references, and an ongoing sound is a lifetime
witness the minimap lacks for a self-buff or a channel. Which phases a given
ability has is recorded per ability [domain:abilities/ability-rules-are-unique]
(Iso's in abilities/iso-contingency-sound-phases and its siblings). The video
witness an equip sound needs is the ability submenu above the tray
[domain:abilities/tray-equip-submenu]; no detector reads it yet, and it is the
next witness to build for the equip phase
"""
see = ["abilities/footstep-surface-variants", "abilities/jump-surface-variants",
       "abilities/tray-equip-submenu", "abilities/iso-contingency-sound-phases",
       "abilities/iso-undercut-sound-phases", "abilities/iso-double-tap-sound-phases",
       "abilities/iso-kill-contract-sound-phases"]

[tray-equip-submenu]
claim = """
When the player pulls out an ability, a submenu of icons appears above the
ability tray and shows while the ability is held: it indicates that the
ability is equipped, a cue separate from the tray's cast indicator. Its icons
name the ability's inputs: Yoru's Gatecrash (E) shows a left-click icon with a
track for sending it forward and a right-click icon with an arrow to the
ground for placing it, and hovering over a teleport location adds an F key
icon with the word FAKE. Other abilities have their own submenus and on-hover
icons. It is drawn in the self or spectated view only.
"""
kind = "appearance"
known = "player"
since = "2026-09-06"
subject = "abilities:tray"
source = """
the player, 2026-09-06 (chat, the ability submenu), restated 2026-09-30 as an
equip indicator beyond the tray cast; the FAKE word confirmed by rendering
"""
use = """
the video witness of an ability's equip, the phase an equip sound needs
[domain:abilities/ability-sound-phases]; the submenu's icons may also name the
ability and its input model. No detector reads it yet: it is the next witness
to build, not a stored stream
"""
see = ["abilities/ability-sound-phases", "abilities/ammo-hidden-while-non-gun-held"]

