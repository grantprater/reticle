[ability-sound-phases]
claim = """
When the local player uses an ability, its equip sound is separate from its cast
sound, and only the local player hears the equip. Some abilities also have an
activation sound and a death or dematerialize sound.
"""
kind = "rule"
known = "player"
since = "2026-09-06"
use = """
segment an ability's audio by phase before matching; an equip template and a
cast template are different references
"""

[ability-voice-line-mask]
claim = """
An agent sometimes speaks a voice line over an ability's equip or cast. The
line is not on every use, and the ability sound under it is unchanged.
"""
kind = "rule"
known = "observed"
since = "2026-09-24"
source = "b9558488a607 Omen ult equips at 60.3 s (voiced) and 72.9 s (unvoiced)"
use = "match against an unvoiced reference with a one-sided score; voice adds energy only"
see = ["abilities/ability-sound-phases"]

[ammo-hidden-while-non-gun-held]
claim = """
The HUD ammo counter disappears while the local player holds anything other
than a gun: an equipped ability or the knife. A held ultimate draws its own
count in its place.
"""
kind = "appearance"
known = "observed"
since = "2026-09-24"
source = "29eff6920e8f, b9558488a607, e78e75b2d191 against the viewmodel"
use = "an equip/unequip witness independent of the tray; it does not say which item"

