# Ability mechanics and observable invariants.
# Schema and the citation form: reticle/domain.py.

[omen-dark-cover]
claim = """
Omen's Dark Cover is a spherical smoke placed from a phased realm view. On the
minimap it renders as a dark circular disc whose black-hat radius scales as
1.825 times the player's self-icon radius. It persists for 15.0 seconds and
remains active after Omen dies.
"""
kind = "rule"
known = "measured"
since = "2026-09-23"
subject = "omen:dark cover"
source = "prototypes/ability_scale.py and prototypes/ability_disc.py on a06f04a0059f and d95cfad5693a"
use = "scale black-hat kernel to self_r * 1.825 and search within t_cast to t_cast + 3.2s"
see = ["abilities/omen-tray-charges"]

[omen-tray-charges]
claim = """
Omen has two Dark Cover charges in slot E. A charge drop of at least 0.25 of
the slot's p90 clean level between consecutive HUD samples indicates a cast.
"""
kind = "rule"
known = "measured"
since = "2026-09-23"
subject = "omen:dark cover"
source = "prototypes/ability_hud.py measured on a06f04a0059f and b9558488a607"
use = "ability_hud.slot_counts at y 1032..1051, x 980..1050 (slot index 2)"
see = ["abilities/omen-dark-cover", "abilities/omen-dark-cover-restock"]

[omen-dark-cover-restock]
claim = """
A spent Dark Cover charge restores after 40 seconds.
"""
kind = "rule"
known = "player"
since = "2026-09-23"
subject = "omen:dark cover"
use = "expected gap before a spent slot E charge refills; replaces a 30 s value the HUD measurement stated"
see = ["abilities/omen-tray-charges"]

