[metric:killfeed_queue/stack@match21#hold_mean_samples=0.86] samples (702
held one sample, 137 none), a delay of about
[metric:killfeed_queue/stack@match21#hold_delay_s=0.43] s, then rose one or
two slots within a sample. Capacity: at most
[metric:killfeed_queue/stack@match21#max_count=6] entries, on
[metric:killfeed_queue/stack@match21#max_count_samples=2] samples
(75a55a296d3b 285.5 and 286.0 s, seen by eye); 5 at 223d636bf8d2
1206.0-1207.0 s and 5822b6646448 115.0-117.0 s
"""
use = """
