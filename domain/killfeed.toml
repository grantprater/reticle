# The killfeed: what one entry draws. Schema and the citation form:
# reticle/domain.py.

[ability-kill-icon]
claim = """
An ability kill draws the ability's icon in the entry's weapon slot, between
killer and victim, where a gun kill draws the gun's silhouette. One ability
use that kills several players draws one entry per victim, each with the icon.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
a06f04a0059f at 99.5 s: Seacow (Breach) kills Truewarrior, chxck and
vanshrana with one Aftershock; three entries, each with the Aftershock icon.
The owner's ability gallery named all three Aftershock (0.69-0.72, margin
about 0.18) before the player confirmed
"""
use = """
adjudication.weapon classifies the weapon slot as gun or ability; an ability
icon names the killer's agent, a witness for the lineup and the arbiter
"""
phrases = ["ability icon in the weapon slot"]

[assist-panel]
claim = """
An assisted kill draws an assist panel LEFT of the killer's portrait: the
assisting agent's portrait, with the assisting ability's icon to its right.
The panel can hold two assisters, two portraits. Its portraits and ability
icons are drawn smaller than the killer's and victim's portraits.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
a06f04a0059f at 99.5 s: all three Aftershock kills by Seacow (Breach) carry a
Deadlock portrait with the GravNet icon to its right, left of Seacow's portrait.
The player later saw a double assist (two portraits) while reviewing a VOD, and
noted the panel's portraits and icons are smaller than the entry's portraits
"""
use = """
the icons left of the killer portrait at 284.5 s on a06f04a0059f are this
panel; `killfeed` owns the killer crop and must stop at the panel's edge
"""
exceptions = """
the player has seen at most two assisters and does not know whether two is the
limit. Whether a damage assist by a gun draws a gun icon, and how two assisters'
portraits and icons are ordered, are not known
"""
phrases = ["assist panel", "assist icon left of the killer"]

[chamber-gun-shaped-abilities]
claim = """
Chamber's Headhunter and Tour De Force kill icons are gun silhouettes, a heavy
revolver and a long sniper, not the squarer glyphs other abilities draw. A
gun-shaped icon is therefore not proof of a gun kill.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
the weapon-icon labelling pass (<store>/labels/weapon_icon/): the player named
a 42 px revolver group (32 icons) and a 127 px sniper group (17 icons) Ability,
then said two ability groups were Chamber's ultimate and, they believe,
Headhunter. Which group is which is inferred from shape (revolver Headhunter,
sniper Tour De Force), not stated
"""
use = """
a weapon-icon gallery keeps these two as abilities naming Chamber; the gun
class estimate from width alone would call them a sidearm and a sniper
"""
phrases = ["chamber abilities look like guns"]
