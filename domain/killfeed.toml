# The killfeed: what one entry draws. Schema and the citation form:
# reticle/domain.py.

[ability-kill-icon]
claim = """
An ability kill draws the ability's icon in the entry's weapon slot, between
killer and victim, where a gun kill draws the gun's silhouette. One ability
use that kills several players draws one entry per victim, each with the icon.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
a06f04a0059f at 99.5 s: Seacow (Breach) kills Truewarrior, chxck and
vanshrana with one Aftershock; three entries, each with the Aftershock icon.
The owner's ability gallery named all three Aftershock (0.69-0.72, margin
about 0.18) before the player confirmed. On 2026-10-01 the player named a
19 px teal square with a flame on a06f04a0059f at 287.0-288.5 s, the late frames
of Breach's kill of Jett, "aftershock": it is not Phoenix's Hot Hands
"""
use = """
adjudication.weapon classifies the weapon slot as gun or ability; an ability
icon names the killer's agent, a witness for the lineup and the arbiter
"""
phrases = ["ability icon in the weapon slot"]
see = ["killfeed/damaging-ability-kill-icon"]

[assist-panel]
claim = """
An assisted kill draws an assist panel LEFT of the killer's portrait: the
assisting agent's portrait, with the assisting ability's icon to its right.
The panel can hold two assisters, two portraits. Its portraits and ability
icons are drawn smaller than the killer's and victim's portraits.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
a06f04a0059f at 99.5 s: all three Aftershock kills by Seacow (Breach) carry a
Deadlock portrait with the GravNet icon to its right, left of Seacow's portrait.
The player later saw a double assist (two portraits) while reviewing a VOD, and
noted the panel's portraits and icons are smaller than the entry's portraits
"""
use = """
the icons left of the killer portrait at 284.5 s on a06f04a0059f are this
panel; `killfeed` owns the killer crop and must stop at the panel's edge
"""
exceptions = """
the player has seen at most two assisters and does not know whether two is the
limit. Whether a damage assist by a gun draws a gun icon, and how two assisters'
portraits and icons are ordered, are not known
"""
phrases = ["assist panel", "assist icon left of the killer"]
see = ["killfeed/disabling-ability-assist-icon"]

[damaging-ability-kill-icon]
claim = """
Any damaging ability can draw a kill's weapon-slot icon
[domain:killfeed/ability-kill-icon]. Which abilities damage is read from the
reference's ability descriptions, one ability at a time.
"""
kind = "rule"
known = "player"
since = "2026-10-01"
source = """
the player, 2026-10-01: "As I've said before, any damaging ability, which I
believe we have a reference for. And any disabling ability can appear in the
assist sidecar, things like deadlock's gravnet, smokes, flashes, stuns". The
reference is <store>/reference/abilities.json (valorant-api agents with the
wiki harvest). No earlier wording of the rule was found in the private notes
"""
use = """
`adjudication.killfeed_kits` derives each agent's kit from the descriptions
and lists every ability its rule cannot decide as a question;
`adjudication.weapon` lowers its kit floor only for an agent with no question
"""
exceptions = """
the player said "can appear", not that no other ability draws a weapon-slot
icon; revive icons [domain:killfeed/revive-entries] are not damage. The
player, 2026-10-01, on the abilities the description rule left open:
"Killjoy turret, phoenix blaze and hot hands, raze blast pack and boom bot.
Iso kill contract might show the icon if he kills them in it, that's the only
borderline one, nothing else does damage" (Decay, heals and the rest are not
damage; `killfeed_kits.PLAYER_ANSWERS`). A passive draws no icon
[domain:abilities/passive-abilities-draw-no-ui]
"""
see = ["killfeed/ability-kill-icon", "abilities/ability-rules-are-unique"]

[disabling-ability-assist-icon]
claim = """
Any disabling ability can draw an assist icon in the panel left of the killer
[domain:killfeed/assist-panel]: Deadlock's GravNet, smokes, flashes and
stuns, for example.
"""
kind = "rule"
known = "player"
since = "2026-10-01"
source = """
the player, 2026-10-01, in the same answer as
[domain:killfeed/damaging-ability-kill-icon]: "And any disabling ability can
appear in the assist sidecar, things like deadlock's gravnet, smokes, flashes,
stuns"
"""
use = """
`adjudication.killfeed_kits` lists each agent's disabling abilities
(`assist_icons`) from the descriptions; no reader uses the list yet
"""
exceptions = """
whether a damaging ability, a Reveal or a movement barrier draws an assist
icon is not known
"""
see = ["killfeed/assist-panel", "abilities/ability-rules-are-unique"]

[chamber-gun-shaped-abilities]
claim = """
Chamber's Headhunter and Tour De Force kill icons are gun silhouettes, a heavy
revolver and a long sniper, not the squarer glyphs other abilities draw. A
gun-shaped icon is therefore not proof of a gun kill.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
the weapon-icon labelling pass (<store>/labels/weapon_icon/): the player named
a 42 px revolver group (32 icons) and a 127 px sniper group (17 icons) Ability,
then said two ability groups were Chamber's ultimate and, they believe,
Headhunter. Which group is which is inferred from shape (revolver Headhunter,
sniper Tour De Force), not stated
"""
use = """
a weapon-icon gallery keeps these two as abilities naming Chamber; the gun
class estimate from width alone would call them a sidearm and a sniper
"""
phrases = ["chamber abilities look like guns"]

[revive-entries]
claim = """
A revive draws a killfeed entry that is not a death. Its left name is the
reviver and its right name the revived, both of one team. Sage's Resurrection
draws the Sage as reviver and the revived teammate as revived, with the
Resurrection icon; a revive of a downed KAY/O draws any teammate as reviver and
KAY/O as revived [domain:killfeed/kayo-downed-entry]; Clove's Not Dead Yet is a
self-revive, Clove's player as both reviver and revived, with the ult's round
icon in the weapon slot. Every revive sits on the reviving team's plate colour.
An ally Resurrection banner is green end to end, and its chevron divides a
darker green from a lighter green, where a kill's chevron divides green from
red.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
the killfeed-icon labelling pass (<store>/labels/killfeed_icon/): the player named
15 entries Not Dead Yet (e.g. 9acf02f98283 MrTaco -> MrTaco at 659.0 s) and 5
Resurrection (59c70f1ef720 sneaks -> Jett at 961.0 s); death-adjudication-0.8.0
stores all 20 as deaths. Frames since: e37fdeca944f 592.5 s shows Clove -> Clove
with the Not Dead Yet icon a second after Reyna kills that Clove, and
b7d24102a6f6 1014.0 s shows Sage -> Raze with Resurrection. The roles: the
player, 2026-10-01 (chat), on calling the Sage the killer: "Maybe we should
split the terms, or I guess have a separate term for teammate -> teammate
entries (reviver and revivee?)"; and "clove is a self-revive, should be in the
same category as the other revives". Stored rows keep the fields `killer` and
`victim` for both roles [domain:killfeed/entry-types]
"""
use = """
the death owner must not count a revive entry as a death; the weapon-slot icon
is one witness and the one-colour plates another (`killfeed.killer_is_ally`,
`adjudication.death.plate_revive`), beside [domain:rounds/resurrection-mechanics]
"""
exceptions = """
a Clove revive that expires draws its own entry, a death, with a broken
butterfly and no ring [domain:rounds/clove-revive-expiry-entry]; the Not Dead
Yet entry is the revive itself (7 of 16 come 1.0-2.0 s after a named Clove
death, and the top bar never shows that death)
"""
phrases = ["revive entry is not a death"]
see = ["killfeed/kayo-downed-entry", "killfeed/entry-types"]

[entry-types]
claim = """
A killfeed entry is one of three types, each with two roles. A kill: killer,
victim. A second-life death, whose victim is not out of the round: Phoenix
killed inside Run It Back, and KAY/O downed inside NULL/cmd
[domain:killfeed/kayo-downed-entry], with the same layout as a kill (killer,
victim). A revive: reviver, revived [domain:killfeed/revive-entries], which
holds Sage's Resurrection, a teammate's revive of a downed KAY/O, and Clove's
Not Dead Yet as a self-revive. An icon an entry can carry depends on its
context: a Phoenix Run It Back badge only when the victim is Phoenix, alive in
the round and inside his ultimate; a Sage revive entry only when a Sage is in
the game and alive and a teammate on her side is dead; and the acting agent's
kit (the killer's or the reviver's) bounds which ability icon the weapon slot
can show.
"""
kind = "rule"
known = "player"
since = "2026-10-01"
source = """
the player, 2026-10-01 (chat), on the proposed types (kill; Sage or KAY/O
revive; KAY/O down; Not Dead Yet apart): "phoenix dead in ult would have the
same structure as a kay/o down, and clove is a self-revive, should be in the
same category as the other revives"; on Breach's 287 s Aftershock on
a06f04a0059f: "considering breach is the killer in that killfeed entry that
should also narrow it down"; and on reading icons: "If the victim is not
phoenix or there is no phoenix in the game or alive there will not be a
phoenix ult icon in the killfeed entry. Likewise if sage is not in the game or
alive or no one on her team is dead there will not be a sage revive entry"
"""
use = """
`adjudication.death.entry_type` names an entry's type and `ENTRY_ROLES` its
roles; `entry_actor` names the acting role's agent, whose kit
`adjudication.weapon.entry_weapon` tries first. Stored rows keep `killer` and
`victim` for the left and right names of every type
"""
phrases = ["three entry types", "reviver and revived"]
see = ["killfeed/revive-entries", "killfeed/kayo-downed-entry", "killfeed/ability-kill-icon"]

[jett-blade-storm-icon]
claim = """
A Jett Blade Storm kill draws a thin knife in the weapon slot, narrower and
fainter than the gun silhouettes.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
the killfeed-icon labelling pass: several entries the player marked Bad crop were
Blade Storm kills (e.g. 59c70f1ef720 Jett -> Jaystic at 2571.0 s), and one was a
Deadlock ult kill; `killfeed`'s weapon-slot box landed on a portrait or a name
"""
use = "killfeed's weapon-slot locator must find this icon before any gallery can name it"

[killstreak-indicator]
claim = """
A killer on a kill streak within the round carries a roman numeral left of
the killfeed entry, beside the killer's portrait, in the position the assist
panel uses: which kill of the round this entry is for that player.
"""
kind = "appearance"
known = "player"
since = "2026-09-25"
source = """
the player, 2026-09-25, naming the badge the weapon-slot locator mistook for
name text; frames show III, IV and V on Jett's Blade Storm streak at
59c70f1ef720 2079.5, 2091.0 and 2111.0 s
"""
use = """
the numeral is glyph-sized but sits below the names' baseline; it is not the
killer's name, and it counts the killer's kills in the round, a witness to
check a kill count against
"""
exceptions = """
the numeral starts at the third kill (the player, 2026-09-25: II would be far
more common, and III is the lowest seen). How the numeral and a two-assister
panel share the space left of the entry is not known; the player expects a
priority order rather than a wider row
"""
phrases = ["killstreak numeral", "kill streak badge"]

[environmental-self-entry]
claim = """
A spike detonation kill draws the spike's hexagonal icon in the weapon slot,
with the dead player's name on both sides of the entry. It is an
environmental death: no player killed them.
"""
kind = "appearance"
known = "player"
since = "2026-09-25"
source = """
the killfeed-icon labelling pass, batch 3: the player named bdfdcf009dba
Evan -> Evan at 1794.0 s Environmental, and then said these were spike
deaths; the same hexagon draws on 96aa1ae9b96f Clove -> Clove at 721.5 s and
c40d950031bb TylerMGZ -> TylerMGZ at 632.5 s
"""
use = """
a self entry (Me -> Me) is not only Clove's revive expiring
[domain:rounds/clove-revive-expiry-entry]; the weapon-slot icon tells a spike
death (hexagon) from the expiry (broken butterfly); a spike death names no
killer, and it marks a detonation, which ends the round
"""
phrases = ["spike death icon", "environmental death icon", "hexagon self kill"]

[assist-panel-layout]
claim = """
The assist panel fills the top 18 of the entry band's 34 rows and ends one to
three pixels left of the killer's portrait. Each assister takes about 52 px:
a portrait cell as wide as the band is high (34 px) on a plate, then,
when drawn, an ability icon cell about 19 px wide on translucent grey. The
icon cell has no crisp lower edge; the portrait cell does. The killstreak
numeral [domain:killfeed/killstreak-indicator] sits in the bottom half,
under the panel, beside the killer's portrait; both can appear together.
"""
kind = "appearance"
known = "measured"
since = "2026-09-25"
source = """
180 entries sampled uniformly over the 20 sessions with a hud crop cache
(`prototypes/assist_panel.py sheet`), and row and column pixel steps on
a06f04a0059f 185.0 s and 1423.0 s, 223d636bf8d2 823.5 s, 3694746e4e54
602.5 s and bdfdcf009dba 210.0 s
"""
see = ["killfeed/assist-panel"]

