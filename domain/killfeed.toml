[stack-order]
claim = """
A new killfeed entry appears at the bottom of the stack. An entry on screen
does not move when a newer one arrives; it rises one slot when an entry above
it expires. The topmost entry is therefore the oldest on screen, and an entry
never moves down.
"""
kind = "rule"
known = "player"
since = "2026-09-29"
source = """
the player, 2026-09-29, answering the stack question the prior-readers audit
raised (docs/PRIOR_DRIVEN_READERS.md). Stored rows agree: at c40d950031bb
908.5 s a new entry reads in slot 1 below the one in slot 0; slot 0 empties at
909.5 s and the newer entry reads in slot 0 at 910.0 s
"""
use = """
follow an entry across frames by letting it stay or rise, never fall
(`checks.track_entries`, `adjudication.death.follow_entry_portraits`); a band
in the top slot is the oldest entry on screen, and the newest only when alone
"""
exceptions = """
the player thinks the stack may also rise when it reaches a maximum count, and
does not know whether such a maximum exists. If it does, it is greater than
four, so a rise without an expiry would be rare
"""
phrases = ["new entries arrive at the top", "killfeed stack direction"]

[kayo-downed-entry]
claim = """
When KAY/O is downed in his ultimate (NULL/cmd), the killfeed draws an entry at
the down, marked by an icon like an X inside a downward-pointing triangle,
drawn beside KAY/O's name as Phoenix's Run It Back badge is. When
a teammate revives the downed KAY/O, the killfeed draws a revive entry laid out
as a Sage Resurrection entry [domain:killfeed/revive-entries]: the reviver, any
teammate, as killer, KAY/O always as the recipient, and the X-in-triangle icon
in place of Resurrection's, in the weapon slot between the two names. A KAY/O revive entry always follows a down entry
for KAY/O in the same round, inside his ultimate, and both carry the same
X-in-triangle icon.
"""
kind = "appearance"
known = "player"
since = "2026-10-01"
source = """
the player, 2026-10-01 (chat), asked whether a downed KAY/O shows a killfeed
entry: "It does show an entry, it's with an icon that looks sort of like an x
inside a triangle pointing downwards"; in a second answer: "then that same
icon is shown with the teammate who revived if there was a revive"; and in a
third: "The entry is basically the same as a sage res entry except the reviving
teammate can be anyone, the recipient is always kay/o, and the icon is
different"; and in a fourth: "And it has to be following kay/o being downed in
his ult, with the same icon on the original death killfeed entry"; and, asked
whether the down icon sits in the weapon slot or beside KAY/O's name: "It's
beside his name yes". Shown the revive entry at 4f207c0c4e39 799.5 s (the
icon ringed in the weapon slot, <store>/analysis/killfeed-openset-20261001/g021_context.png),
which they had named NULL/cmd, they said: "Like the down icon, yes. Same as
sage revive". The pair is on that capture
(<store>/analysis/killfeed-openset-20261001/kayo_down_revive_4f207c0c4e39_781-800s.png):
at 790.5 s aatrox (Reyna) downs usopp0936 (KAY/O) with a pistol, the icon
beside usopp0936's name; at 799.0-800.5 s Rimuru (Reyna) revives
usopp0936, both plates red, the icon in the weapon slot
"""
use = """
a KAY/O entry at a down is not yet his death; his minimap icon stays drawn, red
[domain:minimap/red-portrait-states], until a revive or his death. The icon is
the witness that tells a down from a death, and the revive entry carries it too.
The pair is a consistency check: a KAY/O revive entry with no earlier down
entry for KAY/O in the round, under his ultimate, is a misread
"""
