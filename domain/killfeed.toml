lands below the lowest entry on screen; entries stay or rise, never fall or
pass one another; the oldest expires first. When an entry expires, the
entries below it hold their slots about 0.4 s, then rise to their new rest
almost at once. The stack held as many as 6 entries, and rose only after an
expiry.
"""
