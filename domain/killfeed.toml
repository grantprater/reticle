# The killfeed: what one entry draws. Schema and the citation form:
# reticle/domain.py.

[ability-kill-icon]
claim = """
An ability kill draws the ability's icon in the entry's weapon slot, between
killer and victim, where a gun kill draws the gun's silhouette. One ability
use that kills several players draws one entry per victim, each with the icon.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
a06f04a0059f at 99.5 s: Seacow (Breach) kills Truewarrior, chxck and
vanshrana with one Aftershock; three entries, each with the Aftershock icon.
The owner's ability gallery named all three Aftershock (0.69-0.72, margin
about 0.18) before the player confirmed. On 2026-10-01 the player named a
19 px teal square with a flame on a06f04a0059f at 287.0-288.5 s, the late frames
of Breach's kill of Jett, "aftershock": it is not Phoenix's Hot Hands
"""
use = """
adjudication.weapon classifies the weapon slot as gun or ability; an ability
icon names the killer's agent, a witness for the lineup and the arbiter
"""
phrases = ["ability icon in the weapon slot"]
see = ["killfeed/damaging-ability-kill-icon"]

[assist-panel]
claim = """
An assisted kill draws an assist panel LEFT of the killer's portrait: the
assisting agent's portrait, with the assisting ability's icon to its right.
The panel can hold two assisters, two portraits. Its portraits and ability
icons are drawn smaller than the killer's and victim's portraits.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
a06f04a0059f at 99.5 s: all three Aftershock kills by Seacow (Breach) carry a
Deadlock portrait with the GravNet icon to its right, left of Seacow's portrait.
The player later saw a double assist (two portraits) while reviewing a VOD, and
noted the panel's portraits and icons are smaller than the entry's portraits
"""
use = """
the icons left of the killer portrait at 284.5 s on a06f04a0059f are this
panel; `killfeed` owns the killer crop and must stop at the panel's edge
"""
exceptions = """
the player has seen at most two assisters and does not know whether two is the
limit. Whether a damage assist by a gun draws a gun icon, and how two assisters'
portraits and icons are ordered, are not known
"""
phrases = ["assist panel", "assist icon left of the killer"]
see = ["killfeed/disabling-ability-assist-icon"]

[damaging-ability-kill-icon]
claim = """
Any damaging ability can draw a kill's weapon-slot icon
[domain:killfeed/ability-kill-icon]. Which abilities damage is read from the
reference's ability descriptions, one ability at a time.
"""
kind = "rule"
known = "player"
since = "2026-10-01"
source = """
the player, 2026-10-01: "As I've said before, any damaging ability, which I
believe we have a reference for. And any disabling ability can appear in the
assist sidecar, things like deadlock's gravnet, smokes, flashes, stuns". The
reference is <store>/reference/abilities.json (valorant-api agents with the
wiki harvest). No earlier wording of the rule was found in the private notes
"""
use = """
`adjudication.killfeed_kits` derives each agent's kit from the descriptions
and lists every ability its rule cannot decide as a question;
`adjudication.weapon` lowers its kit floor only for an agent with no question
"""
exceptions = """
the player said "can appear", not that no other ability draws a weapon-slot
icon; revive icons [domain:killfeed/revive-entries] are not damage. The
player, 2026-10-01, on the abilities the description rule left open:
"Killjoy turret, phoenix blaze and hot hands, raze blast pack and boom bot.
Iso kill contract might show the icon if he kills them in it, that's the only
borderline one, nothing else does damage" (Decay, heals and the rest are not
damage; `killfeed_kits.PLAYER_ANSWERS`). A passive draws no icon
[domain:abilities/passive-abilities-draw-no-ui]
"""
see = ["killfeed/ability-kill-icon", "abilities/ability-rules-are-unique"]

[disabling-ability-assist-icon]
