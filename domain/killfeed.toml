[entry-types]
claim = """
A killfeed entry is one of three types, each with two roles. A kill: killer,
victim. A second-life death, whose victim is not out of the round: Phoenix
killed inside Run It Back, and KAY/O downed inside NULL/cmd
[domain:killfeed/kayo-downed-entry], with the same layout as a kill (killer,
victim). A revive: reviver, revived [domain:killfeed/revive-entries], which
holds Sage's Resurrection, a teammate's revive of a downed KAY/O, and Clove's
Not Dead Yet as a self-revive. An icon an entry can carry depends on its
context: a Phoenix Run It Back badge only when the victim is Phoenix, alive in
the round and inside his ultimate; a Sage revive entry only when a Sage is in
the game and alive and a teammate on her side is dead; and the acting agent's
kit (the killer's or the reviver's) bounds which ability icon the weapon slot
can show.
"""
kind = "rule"
known = "player"
since = "2026-10-01"
source = """
the player, 2026-10-01 (chat), on the proposed types (kill; Sage or KAY/O
revive; KAY/O down; Not Dead Yet apart): "phoenix dead in ult would have the
same structure as a kay/o down, and clove is a self-revive, should be in the
same category as the other revives"; on Breach's 287 s Aftershock on
a06f04a0059f: "considering breach is the killer in that killfeed entry that
should also narrow it down"; and on reading icons: "If the victim is not
phoenix or there is no phoenix in the game or alive there will not be a
phoenix ult icon in the killfeed entry. Likewise if sage is not in the game or
alive or no one on her team is dead there will not be a sage revive entry"
"""
use = """
`adjudication.death.entry_type` names an entry's type and `ENTRY_ROLES` its
roles; `entry_actor` names the acting role's agent, whose kit
`adjudication.weapon.entry_weapon` tries first. Stored rows keep `killer` and
`victim` for the left and right names of every type
"""
phrases = ["three entry types", "reviver and revived"]
see = ["killfeed/revive-entries", "killfeed/kayo-downed-entry", "killfeed/ability-kill-icon"]

