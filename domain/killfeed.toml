[subpixel-placement]
claim = """
At 1080p the killfeed snaps vertically and not horizontally. An entry's plate
top edge lies on a pixel boundary, at rest and while the stack slides, and the
weapon-slot icon keeps a whole-pixel vertical offset from it. The plate's left
edge and the icon's horizontal position land at any fraction of a pixel, and
the icon's fraction is its own, not its plate edge's.
"""
kind = "appearance"
known = "measured"
since = "2026-10-01"
source = """
