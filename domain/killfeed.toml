# The killfeed: what one entry draws. Schema and the citation form:
# reticle/domain.py.

[ability-kill-icon]
claim = """
An ability kill draws the ability's icon in the entry's weapon slot, between
killer and victim, where a gun kill draws the gun's silhouette. One ability
use that kills several players draws one entry per victim, each with the icon.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
a06f04a0059f at 99.5 s: Seacow (Breach) kills Truewarrior, chxck and
vanshrana with one Aftershock; three entries, each with the Aftershock icon.
The owner's ability gallery named all three Aftershock (0.69-0.72, margin
about 0.18) before the player confirmed
"""
use = """
adjudication.weapon classifies the weapon slot as gun or ability; an ability
icon names the killer's agent, a witness for the lineup and the arbiter
"""
phrases = ["ability icon in the weapon slot"]

[assist-panel]
claim = """
An assisted kill draws an assist panel LEFT of the killer's portrait: the
assisting agent's portrait, with the assisting ability's icon to its right.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
a06f04a0059f at 99.5 s: all three Aftershock kills by Seacow (Breach) carry a
Deadlock portrait with the GravNet icon to its right, left of Seacow's portrait
"""
use = """
the icons left of the killer portrait at 284.5 s on a06f04a0059f are this
panel; `killfeed` owns the killer crop and must stop at the panel's edge
"""
exceptions = """
seen with an ability assist only; whether a damage assist by a gun draws a gun
icon, and how several assisters stack, are not known
"""
phrases = ["assist panel", "assist icon left of the killer"]
