([metric:lotus_elevation/ring@2026-09-30_13-37-46#ring_cx=232.5],
[metric:lotus_elevation/ring@2026-09-30_13-37-46#ring_cy=256.75]) on Split
and [metric:lotus_elevation/ring@2026-09-30_13-25-33#ring_r=230.0] px on
