# The capture and codec path. Facts about how the recording distorts the game,
# not about the game. Schema and the citation form: reticle/domain.py.

[chroma-420]
claim = """
Capture defaults to NV12 / 4:2:0, which stores chroma at HALF resolution in both
axes. A thin coloured rim or a one px arc can therefore be destroyed by the
codec before any reader sees it.
"""
kind = "codec"
known = "measured"
since = "2026-08-30"
source = "prototypes/chroma_test.py"
use = "prefer luma and coverage over a chroma threshold on any thin feature"

[stalled-capture]
claim = """
A stalled capture repeats a frame. Those frames are not observations, and
counting them as reads inflates every rate computed over time.
"""
kind = "codec"
known = "measured"
since = "2026-09-05"
source = """
reticle/stalls.py, which finds repeated frames; doctor's STALL check reports
four affected sessions in the current store, from 2.9% to 9.2% of capture
"""
use = "doctor's STALL check reports the affected span per session"

[session-pixels-are-not-the-map]
claim = """
A capture may determine only the minimap widget's dimensions, placement, and
orientation. Base-map pixels, floor masks, lighting references, and detector
backgrounds come exclusively from baked geometry keyed by (map, profile).
"""
kind = "constraint"
known = "observed"
since = "2026-09-10"
use = """
reticle/geometry.py resolves every path; doctor enforces the boundary, with
prototypes/minimap_geometry.py and prototypes/clip_preflight.py the only
exceptions
"""

[game-audio-track-only]
claim = """
From 2026-09-27 the OBS profile records only the game's audio track. Earlier
captures carry the desktop mix: six match sessions include podcast speech, and
teammates on voice chat are audible, both of which the ultimate voice-line
matcher took for lines (rows 22, 23 and 25 of the 0.1.0 review sheet).
"""
kind = "codec"
known = "player"
since = "2026-09-27"
use = """
score audio false alarms separately for captures before and after this date;
the first game-audio capture is the probe
"""

[weapon-skins-picked-up]
claim = """
The player equipped no weapon skins at the start of the 2026-09 matches, but
the player may have picked up guns other players dropped, which carry their owners'
skins. The player agrees that such a skin can change a gun's equip and firing
sounds.
"""
kind = "constraint"
known = "player"
since = "2026-09-29"
subject = "capture:loadout"
source = """
the player, 2026-09-29 (chat), asked about weapon skins in matches
that the range recording does not cover
"""
use = """
a confounder for the sound bank's gun classes (prototypes/sound_bank.py),
recorded in the range with unskinned guns: a missed or wrong gun-equip or
gun-shot match in a match may be a picked-up skinned gun, not a bank defect
"""
exceptions = """
which matches, rounds or guns involved a picked-up skin is unknown. That skins
change sounds is the player's agreement for equip and firing sounds only;
nothing here claims how much, or for which skins
"""
see = ["capture/game-audio-track-only", "minimap/self-audio-circle"]

[minimap-size-settings]
claim = """
The game has two separate minimap settings: the widget's total size and the
map's scaling inside it. The widget size sets how many screen px the widget
takes; the map scaling sets how large the map, and every in-game distance
drawn on it, is painted inside the widget. From 2026-09-30 the player intends
to capture at the largest widget size and the largest map scaling. That is an
intent, not an observation: no capture at those settings is in the store.
"""
kind = "constraint"
known = "player"
since = "2026-09-30"
subject = "capture:minimap"
source = """
the player, 2026-09-30 (chat), asked why the self audio circle measures
differently on the Split capture 4f207c0c4e39 and on Lotus 5822b6646448
[domain:minimap/self-audio-circle]: the audio
range is one in-game distance on every map, drawn at a size map scaling sets,
and the game has separate widget-size and map-scaling sliders. The player
then stated the intent to capture at the largest of both
"""
use = """
a drawn size (the self audio circle [domain:minimap/self-audio-circle], a
dead Clove's circle, an ability area) is a constant per (map, map scaling),
not per widget px: a capture at other settings needs its own measurement or
a stated transform. Run clip_preflight against a same-map donor on the first
capture at the new settings before scanning
"""
exceptions = """
the settings of the stored captures are not recorded; each stored session's
widget scale comes from its fitted placement, and its map scaling is known
only through the baked geometry it matches
"""
see = ["capture/largest-scaling-shows-whole-map-belief", "capture/session-pixels-are-not-the-map",
       "minimap/widget-ring"]

[largest-scaling-shows-whole-map-belief]
claim = """
At the largest map scaling the minimap still shows the whole map, perhaps
clipping a small corner. The player believes this from having used the
setting before; it is not observed on any stored capture.
"""
kind = "geometry"
known = "player"
since = "2026-09-30"
subject = "capture:minimap"
source = """
the player, 2026-09-30 (chat), asked whether the largest map scaling still
shows the whole map
"""
use = """
the falsifier is the first capture at the new settings
[domain:capture/minimap-size-settings]: clip_preflight against a same-map
donor shows whether the baked map fits inside the widget or a corner is cut.
Until then no reader may assume the whole map lies inside the widget at that
scaling; a clipped corner is missing floor, not unlit floor
"""
see = ["capture/minimap-size-settings", "minimap/widget-ring"]
