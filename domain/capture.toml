the falsifier is the first capture at the new settings
[domain:capture/minimap-size-settings]: clip_preflight against a same-map
donor shows whether the baked map fits inside the widget or a corner is cut.
Until then no reader may assume the whole map lies inside the widget at that
scaling; a clipped corner is missing floor, not unlit floor
"""
exceptions = """
tested 2026-09-30 on one clip per map [domain:capture/largest-settings-widget]
(prototypes/lotus_elevation.py clipped_corner). The widget boundary is the
drawn ring [domain:minimap/widget-ring]; the map is painted only inside it.
Fitted in the baked bigmap statics it has radius
[metric:lotus_elevation/ring@2026-09-30_13-37-46#ring_r=229.75] px about
([metric:lotus_elevation/ring@2026-09-30_13-37-46#ring_cx=232.5],
[metric:lotus_elevation/ring@2026-09-30_13-37-46#ring_cy=256.75]) on Split
and [metric:lotus_elevation/ring@2026-09-30_13-25-33#ring_r=230.0] px on
Lotus. Lotus: held, a small corner cut:
[metric:lotus_elevation/ring@2026-09-30_13-25-33#outside_px=122] baked map px
lie outside the ring, at x 421-432, y 123-141. Split: falsified, as the player
said (chat, 2026-09-30): the far B corner (B Back) is cut,
[metric:lotus_elevation/ring@2026-09-30_13-37-46#region0_px=500] baked map px
at x [metric:lotus_elevation/ring@2026-09-30_13-37-46#region0_x0=17]-[metric:lotus_elevation/ring@2026-09-30_13-37-46#region0_x1=39],
y [metric:lotus_elevation/ring@2026-09-30_13-37-46#region0_y0=132]-[metric:lotus_elevation/ring@2026-09-30_13-37-46#region0_y1=177],
and a second corner of
[metric:lotus_elevation/ring@2026-09-30_13-37-46#region1_px=128] px at x
430-441, y 139-158. At these settings a reader treats baked floor outside the
