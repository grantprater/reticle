since = "2026-10-04"
source = """
the player, 2026-10-04 (chat), asked about the top-bar white pill: "Yes, and
no I don't think it includes shield but I'm not positive". Game build
release-13.06-shipping-18-5590001: PlayerParticipantWidget_v2's exported JSON
under <store>/reference/game-files/release-13.06-shipping-18-5590001/hud-layout/.
Measured by prototypes/topbar_pill.py on the hud crop cache of 4f207c0c4e39,
59c70f1ef720 and a06f04a0059f: the player's own pill (agent and slot from the
identity arbiter), while the player lives and the roster owner counts five
allies (<store>/analysis/topbar-pill-0.4.0/). At full health the fill reads
the same with shield null, 25 or 50
([metric:topbar_pill/self_alive#full_hp_shield_null_fill=0.9707],
[metric:topbar_pill/self_alive#full_hp_shield_25_fill=0.9707],
[metric:topbar_pill/self_alive#full_hp_shield_50_fill=0.9708] of the
pill), where health plus shield predicts 100, 125 and 150 parts of 150. On
damaged samples where the two predictions differ by at least 0.1, hp/100
