2012.5 s on bfad2778a372, and gold at 396.1 s on e37fdeca944f.
"""
kind = "appearance"
known = "observed"
since = "2026-10-04"
subject = "hud:ability tray"
source = """
hand reads of the stored hud_abilities crops (roi_cache, no decode) at the
restock measurement's spends (prototypes/restock_measure.py, CROP_READS):
Recon Bolt gold at 9acf02f98283 1902.0 s, 59c70f1ef720 1322.0 s and
