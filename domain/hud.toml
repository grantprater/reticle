the game's widget data under the store's reference/game-files/
release-13.06-shipping-18-5590001/hud-layout (font face, size and tracking per
TextBlock; the font object is not exported), and the census in
prototypes/game_font_digits.py, which fit every exported face at sizes 10-56 px
to the stored glyphs of a06f04a0059f, 5822b6646448 and 4f207c0c4e39. Each
field's best face is the one named here, at the widget's size
[metric:game_font_digits/census#max_em_offset_px=0.7]; on the clock,
Tungsten-Bold's mean normalised-bitmap difference
[metric:game_font_digits/census#clock_tungsten_bold_mad=0.187] is about six
times DIN Next Regular's [metric:game_font_digits/census#clock_dinnext_regular_mad=0.032];
the shield fits DIN Next Medium at
[metric:game_font_digits/census#shield_fit_pt=14] pt
"""
