# The HUD's fixed widgets: the ally and enemy rosters and their markers.
# Schema: reticle/domain.py.

[spike-carrier-marker]
claim = """
The ally roster at the top of the HUD marks the spike carrier with a spike
icon that overlaps the bottom-left of that teammate's portrait.
"""
kind = "appearance"
known = "player"
since = "2026-09-25"
use = """
a roster portrait read must mask or refuse the carrier's bottom-left corner.
The marker says which teammate carries the spike, an attribution the minimap
spike glyph cannot give
"""
see = ["minimap/spike-glyph", "minimap/no-spike-channel"]
phrases = ["spike carrier marker", "spike on the roster"]

[suppression-indicators]
claim = """
A suppressed player's HUD shows two indicators. The ability tray dims every
slot under a countdown ring, and a suppressed-effect element appears above and
slightly left of the ammo readout. Tejo's drone suppresses, and its effect is
orange; KAY/O's knife shows a similar indicator. KAY/O's ult suppresses for
4 s per pulse. Each pulse restarts the countdown while the ult lasts and the
player stands within the ult's range, which the player believes equals its
audio range. Allies cannot suppress, so suppression witnesses an enemy suppressor.
"""
kind = "appearance"
known = "player"
since = "2026-09-26"
source = "bdfdcf009dba near 362 s (Tejo's drone); a1a995e6b19b 1784.5-1795 s (KAY/O's ult; the count runs 4, 3, 2, 4, 3, 1)"
use = """
tray drops under the countdown ring are suppression, not casts; the element by
the ammo readout is a second channel to gate on before tuning the tray reader
"""
see = ["hud/tray-after-player-death"]

[tray-after-player-death]
claim = """
After the player dies the HUD ability tray stops showing the player's kit: the
death camera blanks it, then it shows the spectated teammate's kit, whose
charges change as that teammate casts and dies. After the round ends the tray
dims.
"""
kind = "lifecycle"
known = "observed"
since = "2026-09-26"
source = "prototypes/tray_suspect_reasons.py: 1771 of 2121 suspect tray drops over 19 sessions fall at or after the player's death; 226 of 643 drops the tray reader called clean are spectated teammates' casts"
use = """
a tray drop is the player's cast only while the player is alive in that round;
gate tray casts on the player's death (stored death verdicts) before binding
anything to them
"""
see = ["minimap/self-icon-shows-spectated"]

[tray-slot-icons]
claim = """
Each ability tray slot draws its ability's official icon above the charge bar:
the white glyph of the game's icon, about 48 px across at 1920x1080 on both
the standard and the big-minimap layout, dimmed while the ability is
unavailable. A spectated teammate's tray draws that teammate's icons, and the
tray returns to the player's own kit in the seconds after the round ends,
before the next round begins.
"""
kind = "appearance"
known = "measured"
since = "2026-09-27"
subject = "hud:ability tray"
source = """
measured 2026-09-27 with `reticle tray-kit` on the stored hud_abilities crops
of four sessions (docs/TRAY_KIT_WITNESS.md): the catalogue icons matched at
48 px (scale 0.375 of the 128 px icon) fit best on all three sessions scanned,
one of them on the big-minimap layout; every return to the player's kit after
a spectated one fell between the rounds table's round end and the next
round's start, except in rounds whose end the table sets at the close
"""
use = """
the icons name whose kit the tray shows; normalised cross-correlation of the
icon's alpha channel reads a lit and a dimmed icon alike
"""
see = ["hud/tray-after-player-death"]

