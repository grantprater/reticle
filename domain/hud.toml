the player, labelling the census montages (2026-09-26): the Skye dog showed
a processing issue, a green overlay that rimmed much of the minimap in
orange and spread distortions through the parse; Tejo's drone has an
overlay too, and possibly Sova's to a lesser extent. Measured on the minimap
crop (465x485 at 15,15) 1 s before and 1-6 s after the cast: the green
fraction rises from 0.015 to 0.64 during Trailblazer on fc02a2c1ac01 and
the production teal weight from 0.0007 to 0.089-0.139; Owl Drone on
aab12e41dcfc and Stealth Drone on c0b63335e635 stay under 0.02 green and
