[digit-fonts]
claim = """
The HUD's digits draw in DIN Next (the game's DINNext_Font), never Tungsten.
Each widget names a face and a point size, and Slate draws a point as 96/72 px
at 1080p. The round clock (TimerHUDElement TimerLine1) is 28 pt, the team
scores (TeamScoreHUDElement Score) 22 pt and the ammo reserve 16 pt, each in
face 'Default', which resolves to DINNext_Font's first face, Regular. Health
(HealthText) and the magazine (LoadedAmmo) are DIN Next Medium 36 pt, and the
scoreboard's kills, deaths, assists and credits DIN Next Medium 11 pt. The
shield's widget (ArmorHUDElement_CharacterHUD) is not exported; its digits
draw in DIN Next Medium at about 14 pt.
"""
kind = "appearance"
known = "measured"
since = "2026-10-04"
subject = "hud:scoreline"
