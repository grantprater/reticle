"""
see = ["weapons/per-weapon-properties"]

[drop-with-equip-sound]
claim = """
Dropping a gun comes with the equip sound of the item the player holds next:
on the range the knife's equip and the Classic's drop sounded together. The
player believes a drop always carries an equip sound.
"""
kind = "rule"
known = "player"
since = "2026-09-30"
subject = "weapons:audio"
source = """
the player, 2026-09-30 (sound_demo_20260930 labels / chat), reviewing the
second range clip C:/Users/grant/Videos/2026-09-30 13-15-03.mp4 (session
9eb0960b1eff), the relabel at 240.97 s
"""
use = """
an equip detection near a drop is the drop's own equip, not a separate
choice to switch; a drop reference cut alone holds an equip, so drop and
equip templates overlap by construction
"""
exceptions = """
that every drop carries an equip sound is the player's belief; one drop was
labelled; the player did not know how to separate the two sounds
"""
see = ["weapons/per-weapon-properties", "capture/weapon-skins-picked-up"]

[warden]
claim = """
The Warden is a gun new to the game. It is a rifle in the same class as the
Vandal and the Phantom, at the same price, designed for long range as a
compromise with a sniper rifle.
"""
kind = "rule"
known = "player"
since = "2026-10-01"
source = """
the player, 2026-10-01 (chat), shown an unnamed rifle icon from the open-set
killfeed measurement (prototypes/killfeed_openset.py, 4f207c0c4e39): "That's
the warden, it's a new gun", and then: "It's a rifle in the same class as
vandal and phantom, same price, though it's intended to be long-range and
sort of a compromise with sniper"
"""
use = """
adjudication.weapon names it a rifle; its killfeed icon is
[domain:killfeed/warden-icon]. Captures before it existed cannot show it
"""
exceptions = """
the player gave no price figure, magazine, damage, fire rate or release date;
[domain:weapons/magazine-and-reserve] does not list it
"""
phrases = ["warden rifle", "new gun warden"]
see = ["weapons/magazine-and-reserve", "weapons/per-weapon-properties",
       "killfeed/warden-icon"]

[wall-penetration-surfaces]
claim = """
A bullet's loss through a wall depends on the surface it hits. The game maps
each physical surface type to a penetration class, and each class sets an
EnergyReductionMultiplier: FullyPenetrable 0.0 (Water, Flesh, BrokenGlass,
CarpetOnWood, Cloth, CarpetOnConcrete), VeryLow 0.2 (Glass, CrunchyLeaves,
GlassFloor), Low 0.25 (Dirt, Grass, Snow, GarbageBag, Sand), Moderate 0.333
(Gravel, Wood, EtherGlass, PlasticHollow, WoodPuddle), High, which sets no
value (the default surface, Concrete, Linoleum, ConcretePuddle, Thorns, Mud,
Tree, Ice, ShootinRangeTarget, CobbleStone, CeramicTile), VeryHigh 2.0 (Metal,
MetalThin, MetalNonResonant, MetalPipe) and Impenetrable 100000 (Impenetrable,
BubbleCage, CFabric, GoldenRipple). A global penetration curve falls from 1.0
at 0 through 0.9 at 1, 0.6 at 25, 0.5 at 50 and 0.3 at 99 to 0.0 at 100.
"""
kind = "measurement"
known = "measured"
since = "2026-10-05"
subject = "weapons:wall penetration"
source = """
release-13.06-shipping-18-5590001, exported to the store's
reference/game-files/<build>/wallpen/ (manifest beside it):
ShooterGame/Content/Globals/WallPenGlobals.uasset (AresWallPenetrationGlobals:
WallPenetrationType[0..38] indexed by EPhysicalSurface, GlobalPenetrationCurve);
ShooterGame/Content/Equippables/Guns/_Core/WallPenetration/WallPen_*.uasset
(AresWallPenetration.EnergyReductionMultiplier);
ShooterGame/Content/Environment/PhysicalMaterials/M_*.uasset
(PhysicalMaterial.SurfaceType); surface names from
config/ShooterGame/Config/DefaultEngine.ini PhysicalSurfaces. The class schema
(FModel's usmap for 13.06): AresWallPenetration holds
EnergyReductionMultiplier, bParticipatesInAirDropoff, bShowsRicochet and
DebugWallPenetrationTypeName.
"""
use = """
the surface class of a sightline's occluders, for a wallbang test; a surface
reaches a hit through the hit triangle's material PhysMaterial, else the mesh
BodySetup's, else SurfaceType_Default (the engine's rule)
"""
exceptions = """
WallPen_High serialises no EnergyReductionMultiplier: its value is the native
class default, unread; FullyPenetrable serialises its 0.0, so the default is
not zero, and the ladder 0.2 < 0.25 < 0.333 < High < 2.0 suggests 1.0. The
base distance or energy the multipliers scale, and the curve's axis unit, are
native and in no export. WallPenetrationType has 39 entries and leaves the
last (index 38, beyond the 37 named surfaces) unset; what an unset entry
means is unread. Whether Valorant's native trace takes a hit's surface by the
engine's rule is unread; component-level material overrides were not read.
"""
values = { energy_reduction = { fully_penetrable = 0.0, very_low = 0.2, low = 0.25, moderate = 0.333, very_high = 2.0, impenetrable = 100000.0 }, curve = { x = [0.0, 1.0, 25.0, 50.0, 99.0, 100.0], y = [1.0, 0.9, 0.6, 0.5, 0.3, 0.0] } }
see = ["weapons/wall-penetration-weapons"]

[wall-penetration-weapons]
claim = """
Each gun's projectile carries a WallPenetrationComponent whose
PenetrationPowerMultiplier and StoppingDistanceMultiplier scale its wall
penetration; a field a projectile leaves unset keeps the component's native
default. The UI tier (WeaponStatUIData.WallPenetration) follows them. Low:
Classic, Frenzy, Spectre, Bucky and Judge set power 0.8 and stopping 0.5;
Shorty and Stinger set stopping 0.5 only. Medium: Vandal, Phantom, Bulldog,
Warden, Marshal, Ghost and Bandit set neither. High: Sheriff, Guardian,
Operator, Outlaw and Ares set power 1.2 and stopping 1.5; Odin's two
projectiles split them, power 1.2 on its primary-fire projectile and stopping
1.5 on the other.
"""
kind = "measurement"
known = "measured"
since = "2026-10-05"
subject = "weapons:wall penetration"
source = """
release-13.06-shipping-18-5590001, set weapon-data: each gun folder's
projectile class (for example
ShooterGame/Content/Equippables/Guns/Sidearms/Revolver/Projectile_Revolver.uasset),
WallPenetrationComponent_GEN_VARIABLE; the parent
ShooterGame/Content/Equippables/Guns/_Core/Projectile_Gun.uasset (store
reference/game-files/<build>/wallpen/) sets neither field; UI tiers from each
gun's UIData class and valorant-api weaponStats.wallPenetration. The usmap
schema of WallPenetrationComponent holds only these two multipliers,
bApplyPostPenetrationAirDropoff, PostPenetrationAirDropoffDistance and the
impact effects.
"""
use = """
a weapon's penetration budget relative to a Medium gun, for a wallbang test
"""
exceptions = """
The base stopping distance and penetration power the multipliers scale are
native and in no export, so no field gives the wall thickness a gun passes;
which multiplier gates passage and which scales damage is unread, and so is the
native default an unset field keeps (a Medium gun's value). The
pre-blast Bucky projectile sets both to 0.0.
"""
values = { low = { power = 0.8, stopping = 0.5 }, high = { power = 1.2, stopping = 1.5 } }
see = ["weapons/wall-penetration-surfaces"]

[kill-line-of-sight]
claim = """
A kill needs a line of sight between killer and victim only when a gun's
bullet reached the victim through open air. A wallbang needs none: everything
between the two must be penetrable, one object or, in some cases, several. An
ability kill needs none either, and reaches far more freely than a wallbang.
"""
kind = "rule"
known = "player"
since = "2026-10-05"
use = """
`episodes.classify_acts` classes each hit from the replay's own damage record:
the equippable's kind (`equippables.equippable_kind`) and the record's
`wall_penetration` flag; `wall_penetration.Penetration` counts what lies on a
flagged hit's line. How many penetrable objects a wallbang crosses is measured
there, not assumed (docs/EPISODES.md section 9)
"""
see = ["weapons/wall-penetration-surfaces", "weapons/wall-penetration-weapons"]
phrases = ["wallbangs need no line of sight"]
