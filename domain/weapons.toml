# Weapons: facts about the game's guns, not about any reader of them. Schema and
# the citation form: reticle/domain.py.

[magazine-and-reserve]
claim = """
The HUD ammo counter shows magazine | reserve. A full load per weapon is:
sidearms Classic 12 | 36, Shorty 2 | 6, Frenzy 15 | 45, Ghost 13 | 39,
Bandit 8 | 24, Sheriff 6 | 24; SMGs Stinger 20 | 60, Spectre 30 | 90; shotguns
Bucky 5 | 10, Judge 5 | 15; rifles Bulldog 24 | 72, Guardian 12 | 36,
Phantom 30 | 60, Vandal 25 | 50; sniper rifles Marshal 5 | 15, Outlaw 2 | 10,
Operator 5 | 10; machine guns Ares 50 | 100, Odin 100 | 200. Melee (the knife)
has no ammo counter.
"""
kind = "measurement"
known = "player"
since = "2026-09-24"
use = """
a full magazine | reserve pair read after a buy or reload names the held gun's
class; the magazine read at a kill is the gun that made it
"""
exceptions = """
three pairs are shared and the ammo counter alone cannot separate them:
Classic and Guardian 12 | 36, Bucky and Operator 5 | 10, Judge and Marshal
5 | 15; break the tie with another witness (the killfeed weapon icon, credits
spent). A partial pair only bounds the capacity from below. The Warden
[domain:weapons/warden], new on 2026-10-01, is not listed; its load is not known.
"""
phrases = ["magazine capacity", "ammo reserve per weapon"]

[per-weapon-properties]
claim = """
Each weapon also has its own damage per body part, damage falloff with range,
run speed, equip speed, reload speed and fire rate.
"""
kind = "rule"
known = "player"
since = "2026-09-24"

[weapon-run-and-walk-speeds]
claim = """
Each weapon sets its own running and walking speed. The player expects the
differences to matter little. The values are on the wiki and in the game
files.
"""
kind = "rule"
known = "player"
since = "2026-10-04"
source = """
the player, 2026-10-04 (chat), answering which dashes join the teleport
list: "There are also weapon-specific running and walking speeds that
probably don't matter that much, but they are on the wiki and in the game
files"
"""
use = """
the run ceiling `minimap.RUN_PX` is one measured value for every weapon; the
per-weapon values are being extracted from the game files into their own
facts and are not recorded here
"""
see = ["weapons/per-weapon-properties"]

[sheriff-shot-lingering-fade]
claim = """
A Sheriff shot has a fading tail that lingers well after the shot.
"""
kind = "rule"
known = "player"
since = "2026-09-30"
subject = "weapons:sheriff:audio"
source = """
the player, 2026-09-30 (sound_demo_20260930 labels / chat), reviewing the
second range clip C:/Users/grant/Videos/2026-09-30 13-15-03.mp4 (session
9eb0960b1eff), the note on the 56.8 s shot
"""
use = """
a Sheriff shot reference spans its tail (0.84 s on the range); a sound heard
in the tail is not a second shot, and the tail can mask a quiet sound after it
"""
see = ["weapons/per-weapon-properties", "abilities/ability-sound-phases"]

[sheriff-reload-two-part]
claim = """
The Sheriff's reload is a two-part sound: loading the rounds, then the
cylinder clicking back into the gun.
"""
kind = "rule"
known = "player"
since = "2026-09-30"
subject = "weapons:sheriff:audio"
source = """
the player, 2026-09-30 (sound_demo_20260930 labels / chat), reviewing the
second range clip C:/Users/grant/Videos/2026-09-30 13-15-03.mp4 (session
9eb0960b1eff), the note on the 63.1 s partial reload
"""
use = """
a Sheriff reload is two references or one long one; a detection of one part
