# Match and round structure: composition, sides, the clock.
# Schema: reticle/domain.py.

[halftime-side-swap]
claim = """
The sides swap at halftime, so a team's identity is not its side and neither is
constant across a match.
"""
kind = "lifecycle"
known = "observed"
since = "2026-09-02"
use = "reticle/rounds.py owns the boundary; economy and belief read it, never re-derive it"
phrases = ["halftime side swap", "side swaps at halftime"]

[agent-uniqueness]
claim = """
Agents are distinct WITHIN a team and not across the match. Each side fields
five different agents, and both teams may field the same agent at once.
"""
kind = "rule"
known = "player"
since = "2026-09-10"
use = """
so a slot assignment is per SIDE, five slots over the roster, and never a
ten-slot assignment across the match. Naming an agent on one side eliminates it
from that side's other four slots and says NOTHING about the other side
"""
exceptions = """
none. It is the constraint reticle/lineup.py's verdict already applies with
`track.assign`, and the cross-side elimination it forbids would have named 11
refused slots wrongly across the 19 stored lineups
"""

[disconnected-teammate-stays-drawn]
claim = """
A teammate who disconnects stays drawn on the minimap and counted on the
roster.
"""
kind = "rule"
known = "player"
since = "2026-10-04"
source = """
the player, 2026-10-04 (chat), asked whether a disconnected teammate stays
drawn on the minimap and counted on the roster: "Yes, though if they abandon
they no longer spawn at the beginning of the round. They will never just
disappear mid-round though"
"""
use = """
a disconnect never lowers the round's ally capacity; a teammate's icon or
roster slot that persists is that teammate, not a stale read
"""
exceptions = """
how a disconnected teammate's icon moves or looks, and whether its cone
stays drawn, is unasked
"""
see = ["rounds/abandoned-player-not-spawned", "rounds/no-mid-round-disappearance"]

[abandoned-player-not-spawned]
claim = """
A player who abandons the match no longer spawns at the start of later
rounds.
"""
kind = "lifecycle"
known = "player"
since = "2026-10-04"
source = """
the player, 2026-10-04 (chat), answering whether a disconnected teammate
stays drawn and counted: "if they abandon they no longer spawn at the
beginning of the round"
"""
use = """
a team's head count may fall only at a round start, when an abandoned
player is not spawned
"""
exceptions = """
how the roster and the scoreboard show an abandoned player is unasked; how
the abandon pays credits is unknown [domain:rounds/leaver-compensation]
"""
see = ["rounds/disconnected-teammate-stays-drawn", "rounds/no-mid-round-disappearance",
       "rounds/leaver-compensation"]

[no-mid-round-disappearance]
claim = """
A player never disappears mid-round: neither a disconnect nor an abandon
removes them before the round ends.
"""
kind = "rule"
known = "player"
since = "2026-10-04"
source = """
the player, 2026-10-04 (chat), on disconnected and abandoning teammates:
"They will never just disappear mid-round though"
"""
use = """
a teammate lost mid-round is a death, a crowd or a reader loss, never a
departure; the round's ally capacity holds until the round ends
"""
see = ["rounds/disconnected-teammate-stays-drawn", "rounds/abandoned-player-not-spawned"]

[resurrection-mechanics]
claim = """
Only four agents possess resurrection, second-life, or stabilization mechanics:
1. Phoenix (Run It Back): grants a second life before the duel; dying in ult does
   not eliminate Phoenix from the roster or decrement the alive count. The killfeed
   entry carries a circular badge.
2. Sage (Resurrection): resurrects a dead ally on field; the killfeed entry has
   matching team plates and Sage's ultimate icon, increasing the living count.
3. Clove (Not Dead Yet): post-death self-resurrection window with dimmed icon state;
   activating ult immediately restores Clove to the living count.
4. KAY/O (NULL/cmd): downed state with a reddish/overlaid icon instead of immediate death;
   teammates can channel to stabilize him back into active combat.
No other abilities in VALORANT deal with resurrection in any form.
"""
kind = "rule"
known = "player"
since = "2026-09-12"
use = "reticle/adjudication/death.py conditions living roster state transitions, second life flags, and ability icon matching against this closed four-agent set"

[sage-resurrection-revives-at-body]
claim = """
An ally Sage resurrects with Resurrection comes back at their body.
"""
kind = "rule"
known = "player"
since = "2026-10-04"
subject = "sage:resurrection"
source = """
the player, 2026-10-04 (chat), asked where the revived player stands for
each revive: "Sage: at the body"
"""
use = """
a revived ally's icon reappears at that ally's death mark
[domain:minimap/ally-death-mark], never elsewhere
"""
see = ["rounds/resurrection-mechanics", "killfeed/revive-entries", "minimap/ally-death-mark"]

