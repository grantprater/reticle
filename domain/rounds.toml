# Match and round structure: composition, sides, the clock.
# Schema: reticle/domain.py.

[halftime-side-swap]
claim = """
The sides swap at halftime, so a team's identity is not its side and neither is
constant across a match.
"""
kind = "lifecycle"
known = "observed"
since = "2026-09-02"
use = "reticle/rounds.py owns the boundary; economy and belief read it, never re-derive it"
phrases = ["halftime side swap", "side swaps at halftime"]

[agent-uniqueness]
claim = """
Agents are distinct WITHIN a team and not across the match. Each side fields
five different agents, and both teams may field the same agent at once.
"""
kind = "rule"
known = "player"
since = "2026-09-10"
use = """
so a slot assignment is per SIDE, five slots over the roster, and never a
ten-slot assignment across the match. Naming an agent on one side eliminates it
from that side's other four slots and says NOTHING about the other side
"""
exceptions = """
none. It is the constraint reticle/lineup.py's verdict already applies with
`track.assign`, and the cross-side elimination it forbids would have named 11
refused slots wrongly across the 19 stored lineups
"""

[resurrection-mechanics]
claim = """
Only four agents possess resurrection, second-life, or stabilization mechanics:
1. Phoenix (Run It Back): grants a second life before the duel; dying in ult does
   not eliminate Phoenix from the roster or decrement the alive count. The killfeed
   entry carries a circular badge.
2. Sage (Resurrection): resurrects a dead ally on field; the killfeed entry has
   matching team plates and Sage's ultimate icon, increasing the living count.
3. Clove (Not Dead Yet): post-death self-resurrection window with dimmed icon state;
   activating ult immediately restores Clove to the living count.
4. KAY/O (NULL/cmd): downed state with a reddish/overlaid icon instead of immediate death;
   teammates can channel to stabilize him back into active combat.
No other abilities in VALORANT deal with resurrection in any form.
"""
kind = "rule"
known = "player"
since = "2026-09-12"
use = "reticle/adjudication/death.py conditions living roster state transitions, second life flags, and ability icon matching against this closed four-agent set"


[scoreboard-dead-dimmed]
claim = """
The Tab scoreboard keeps a dead player's row and agent portrait in place and
dims them; it does not remove the portrait. The drawing is unchanged, only its
contrast falls.
"""
kind = "appearance"
known = "observed"
since = "2026-09-23"
use = """
reticle/adjudication/scoreboard.py reads a dimmed portrait as dead only on a
fully expanded board, and death attribution uses the newly dimmed set between
two openings as a victim witness
"""
exceptions = """
observed in one August 2026 round of a06f04a0059f, where every expanded
opening's dimmed rows matched the killfeed deaths before it. What dimming MEANS
is [domain:rounds/scoreboard-dim-is-dead]. A board still fading in dims live
rows too, which is an appearance of the animation and not of death
"""
phrases = ["scoreboard dims dead players", "dead portrait is dimmed"]

[scoreboard-relights-after-top-bar]
claim = """
At a round start the top bar redraws all five portraits per side before the
Tab scoreboard relights the previous round's dimmed rows. A board read at the
first sample of the new round can still dim players the top bar shows alive;
0.5 to 3 seconds later every row is lit.
"""
kind = "appearance"
known = "observed"
since = "2026-09-23"
use = """
reticle/reconciliation.py audit_board_alive stores each disagreement's time
since the roster count rose, and the scoreboard death witness skips openings
the roster contradicts
"""

[scoreboard-dim-is-dead]
claim = """
A dimmed scoreboard row means the player is currently dead. A player Sage
resurrects is no longer dimmed. Phoenix dying inside Run It Back is not
expected to dim at all before he reappears.
"""
kind = "rule"
known = "player"
since = "2026-09-23"
use = """
reticle/adjudication/death.py counts newly dimmed agents against killfeed
deaths, excludes second-life deaths from that count, and treats a dimmed row
lit again as a revive rather than a contradiction
"""
exceptions = """
the player does not know the dimming bounds for Clove after death and before
Not Dead Yet, nor how a downed-but-not-dead KAY/O row looks. Neither may be
assumed; a count that disagrees stays a refusal
"""
phrases = ["dimmed means dead", "sage revive is not dimmed"]

[post-round-period]
claim = """
A round is decided when the score increments, but play continues through a
post-round period until the snap to the next buy phase: kills are legal, guns
can be picked up, and those kills count. The player's events in that period
belong to the round just decided.
"""
kind = "lifecycle"
known = "player"
since = "2026-09-24"
use = """
reticle/rounds.py assigns an event to a round from its start up to the next
round's start (the buy-phase snap); the score increment stays the round's end
"""

[match-end]
claim = """
A match ends the moment one team reaches 13 round wins while the other has 11
or fewer. At 12-12 it goes to overtime, played in cycles of two rounds: a team
that wins both rounds of a cycle wins the match, and otherwise play continues
until one team is two rounds ahead. So the final round is the one whose result
first meets that condition, and it has no following buy phase.
"""
kind = "rule"
known = "player"
since = "2026-09-24"
use = """
a match whose last read score does not meet the condition has a final round
the scoreline never closed; the condition decides which team won it
"""

[run-it-back-in-report]
claim = """
The combat report records a Run It Back death as an ordinary row for the enemy
who made it, without the KILLED YOU flag; the real death's panel carries it.
The player believes the row may also differ by an icon or colour; unconfirmed.
"""
kind = "appearance"
known = "player"
since = "2026-09-24"
source = """
a06f04a0059f: no panel between the Run It Back death at 1576.5 s and the real
death at 1593.5 s; the real death's panel lists the Run It Back killer
(vanshrana, 158 incoming) as a row without a KILLED YOU flag
"""


[clove-revive-expiry-entry]
claim = """
When Clove self-revives with Not Dead Yet and gets no kill or damaging assist
within the ult's time window, the revive ends in death. The player believes
the killfeed then shows the player as both killer and victim (Me -> Me).
"""
kind = "lifecycle"
known = "player"
since = "2026-09-24"
source = """
a1a995e6b19b (player Clove) at 1892.5 s: a Me -> Me entry with the circular
badge, which the killfeed reader counted as a kill; the combat report did not
"""
use = """
a Me -> Me entry is not a kill; on a Clove session it is most likely this
expiry, a death rather than a second life
"""
exceptions = """
the player's own abilities can also kill the player (a self-kill), which
shows the same Me -> Me shape; tell the two apart by agent and by an ult
cast before it, never by the entry alone
"""
phrases = ["clove revive expired", "me killed me"]
