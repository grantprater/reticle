[post-round-plant-no-graphic]
claim = """
The spike can be planted after the score changes, in the post-round period. The
scoreline then keeps its post-round countdown and draws no planted-spike graphic.
Such a plant changes nothing in the decided round; it only awards the planting
team its plant credits [domain:rounds/plant-credits].
"""
