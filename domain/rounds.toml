known = "player"
since = "2026-10-02"
source = """
player, 2026-10-02 (chat), confirming this observation: Riot match records aligned to the store clock put plants 2.1 s after the score
change at 223d636bf8d2 near 1303 s (C:/Users/grant/Videos/2026-08-23 20-09-01.mp4)
and 5.8 s after it at 5822b6646448 near 1653 s
(C:/Users/grant/Videos/2026-08-26 12-38-38.mp4); the cached scoreline crops
show the countdown 0:06 to 0:00 through both, no graphic (viewed 2026-10-02)
"""
