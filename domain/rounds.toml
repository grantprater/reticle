[plant-credits]
claim = """
A plant awards 300 credits to each member of the attacking team and nothing to
the defenders, a post-round plant included.
"""
kind = "rule"
known = "observed"
since = "2026-10-04"
source = """
Riot's 22 stored match records (`external/riot/*.json` in the store), replayed
through `reticle.economy.EconomyTracker` by `prototypes/riot_economy.py`: each
round's wallet is `remaining + spent`, compared per team. With 300, the replay reproduces [metric:riot_economy/team_rounds#regular_ok=815] of
[metric:riot_economy/team_rounds#regular_n=816] regular team-rounds, carrying [metric:riot_economy/team_rounds#ok_plant_payments=1310]
plant payments; with 200 it reproduces [metric:riot_economy/team_rounds#plant_200_regular_ok=553]. The
records hold [metric:riot_economy/team_rounds#post_round_plants=25] post-round plants among
[metric:riot_economy/team_rounds#plant_rounds=292] plant rounds. Asked "plant reward 300", the third of eleven numbered
questions (2026-10-04, chat), the player answered "3. Yes".
"""
use = """
scoreboard credits can witness a plant: each attacker's credits rise by this
amount. `rounds.spike_planted` excludes post-round plants, so the ledger takes
plants from the plant witnesses, not from it. `EconomyRules.plant_reward`
holds the value
"""
supersedes = """
the player's statement of 2026-10-03 (chat), answering how post-round plants
are witnessed: "There is also 200 credits added for each member of the planted
team." Riot's records pay 300; the 200 figure was recorded here from
2026-10-03 to 2026-10-04
"""
see = ["rounds/post-round-plant-no-graphic", "rounds/scoreboard-credit-snapshot",
       "rounds/credit-ledger-rules"]

