[credit-ledger-rules]
claim = """
A team's credits follow the reset banks, round rewards, kill rewards, plant
rewards and purchases, under one cap: [domain:rounds/pistol-round-bank],
[domain:rounds/halftime-credit-reset], [domain:rounds/overtime-bank],
[domain:rounds/loss-ladder], [domain:rounds/survival-loss-reward],
[domain:rounds/defuse-reward], [domain:rounds/credit-cap] and
[domain:rounds/plant-credits]. Two more paths move credits outside these
rules, and the ledger does not model them: an AFK round's withheld reward
goes to teammates [domain:rounds/afk-round-reward], and an abandon brings
leaver compensation [domain:rounds/leaver-compensation]. One player's
`remaining + spent` can exceed the cap, so the rules are checked on team
totals, not on each wallet.
"""
kind = "rule"
known = "observed"
since = "2026-10-04"
source = """
Riot's 22 stored match records (`external/riot/*.json` in the store), replayed
through `reticle.economy.EconomyTracker` by `prototypes/riot_economy.py`: each
round's wallet is `remaining + spent`, compared per team. The owner's rules reproduce [metric:riot_economy/team_rounds#regular_ok=815] of [metric:riot_economy/team_rounds#regular_n=816]
regular team-rounds; the miss settles a round with an AFK player
[domain:rounds/afk-round-reward]. A kill reward of 150 instead of 200
reproduces [metric:riot_economy/team_rounds#kill_150_regular_ok=29]
"""
use = """
reticle/economy.py owns the ledger (ownership `credit-ledger`); ask it, never restate
a rule. Compare team totals: `remaining + spent` is no single player's wallet
once a teammate drops or sells
"""
exceptions = """
the records span game versions 13.04 to 13.06; a patch may change any value
"""
see = ["rounds/scoreboard-credit-snapshot"]

