the player, 2026-10-04 (chat), asked where the revived player stands for
each revive: "phoenix: where he cast the ult"; the player's earlier review
of the expiry flash also placed the effigy at the cast point
[domain:abilities/phoenix-run-it-back-expiry-flash]
"""
