[character-eye-height]
claim = """
A player character's base class sets the eye 0.77 m above the capsule centre
standing (BaseEyeHeight) and 0.3 m crouched (CrouchedEyeHeight); the capsule
is 0.42 m in radius with a half-height of 0.98 m, 0.28 m crouched
(CrouchedHalfHeight); the navigation agent is 1.96 m tall, 0.42 m in radius,
with a 0.45 m step. Valorant's own fields add an eye offset of -22.0 cm
standing and -20.0 cm crouched, a crouch compression of 20.0 cm and a 0.275 s
crouch. Under the engine's convention (eye height above the centre of a
capsule standing on the floor) the standing eye is 1.75 m above the floor; the
crouched eye is not derivable, since the native crouch code that applies the
compression and offsets is unread.
"""
kind = "measurement"
known = "measured"
since = "2026-10-04"
subject = "movement:body"
source = """
release-13.06-shipping-18-5590001, set ability-states:
ShooterGame/Content/Characters/_Core/BasePawn.uasset
Default__BasePawn_C.BaseEyeHeight = 77.0, .CrouchedEyeHeight = 30.0,
.StandingEyeOffset = -22.0, .CrouchingEyeOffset = -20.0,
.CrouchCompressionAmount = 20.0, .CrouchTimeSeconds = 0.275;
CollisionCylinder.CapsuleHalfHeight = 98.0, .CapsuleRadius = 42.0;
CharMoveComp.CrouchedHalfHeight = 28.0;
ShooterGame/Content/Characters/_Core/BasePlayerCharacter.uasset
CharMoveComp.NavAgentProps.AgentHeight = 196.0, .AgentRadius = 42.0,
.AgentStepHeight = 45.0 (all cm). BasePlayerCharacter, the parent of every
agent's <Codename>_PC, inherits BasePawn's eye and capsule fields without
overriding them; a game-wide name search (game-extract whorefs) finds
BaseEyeHeight serialized in no other player-character package.
"""
use = """
sightline eye height: the standing value under the stated convention; no crouched value. Crouch room above a floor: the crouched capsule, twice CrouchedHalfHeight
"""
exceptions = """
The standing eye height of 1.75 m is the engine convention's sum, not a field,
and ignores StandingEyeOffset, whose use is unread; with the offset it would
be 1.53 m. A crouched eye height for sightlines needs the native crouch code
or a measurement (the replay's camera, or a capture).
"""
values = { eye = { base_eye_height_m = 0.77, crouched_eye_height_m = 0.3, standing_eye_offset_m = -0.22, crouching_eye_offset_m = -0.2 }, capsule = { radius_m = 0.42, half_height_m = 0.98, crouched_half_height_m = 0.28, crouch_compression_m = 0.2 }, nav_agent = { height_m = 1.96, radius_m = 0.42, step_height_m = 0.45 } }
see = ["game_data/game-units-centimetres"]

[character-jump]
claim = """
A player character's jump tuning sets a maximum jump height of 1.15 m
(DefaultJumpTuning.MaxJumpHeight) and a total jump time of 0.675 s; the engine
fields beside it give a jump launch speed of 7.5 m/s (JumpZVelocity), a
gravity scale of 0.9 and an air control of 0.45. World gravity is -25.0 m/s^2
(DefaultGravityZ). The class chain serializes no walkable floor angle,
walkable floor Z or movement step height (MaxStepHeight): those are the native
class's defaults, unread; the navigation agent's step is a separate field
[domain:game_data/character-eye-height].
"""
kind = "measurement"
known = "measured"
since = "2026-10-04"
subject = "movement:jump"
source = """
release-13.06-shipping-18-5590001, set ability-states:
ShooterGame/Content/Characters/_Core/BasePawn.uasset
CharMoveComp.DefaultJumpTuning.MaxJumpHeight = 115.0 cm,
.DefaultJumpTuning.JumpTotalTime = 0.675 s, .JumpZVelocity = 750.0 cm/s,
.GravityScale = 0.9, .AirControl = 0.45; inherited unchanged by
ShooterGame/Content/Characters/_Core/BasePlayerCharacter.uasset, the parent of
every agent's <Codename>_PC (its CharMoveComp overrides only
JumpOffJumpZFactor, MovementTuning, JumpLandSlowTuningV2 and NavAgentProps).
Neither CharMoveComp serializes WalkableFloorAngle, WalkableFloorZ,
MaxStepHeight, PerchRadiusThreshold; BasePawn_C derives from the native class
/Script/ShooterGame.ShooterCharacter, whose defaults no export carries. World
gravity:
reference/game-files/release-13.06-shipping-18-5590001/config/ShooterGame/Config/DefaultEngine.ini
[/Script/Engine.PhysicsSettings] DefaultGravityZ = -2500.0 cm/s^2, exported
raw by game-extract export (config/manifest.jsonl).
"""
use = """
sightline walk graph: neighbouring floors join when their heights differ by at most the maximum jump height
"""
exceptions = """
Which jump the native movement code runs is unread. The following arithmetic
is ours, not a field: a ballistic launch at JumpZVelocity under GravityScale
times world gravity (22.5 m/s^2) rises 1.25 m and lasts 0.667 s, which agrees
with JumpTotalTime (0.675 s); MaxJumpHeight (1.15 m) sits 0.1 m under that
rise, and which of the two limits a jump is native code. Crouching in the air
is native code; what it adds to a reachable ledge is not included. The
walkable floor angle for sightline floors stays the engine default, a
placeholder.
"""
values = { jump = { max_jump_height_m = 1.15, jump_total_time_s = 0.675, jump_z_velocity_m_s = 7.5 }, scale = { gravity_scale = 0.9, air_control = 0.45 }, world = { default_gravity_z_m_s2 = -25.0 } }
see = ["game_data/game-units-centimetres", "game_data/character-eye-height"]

