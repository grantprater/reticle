# Values read from the extracted game files of build 13.06
# (release-13.06-shipping-18-5590001), one table per ability or movement fact.
# Each value cites its asset, export and field; lengths are converted from
# centimetres. Schema and the citation form: reticle/domain.py.
# Regenerate with prototypes/game_data_facts.py; never edit by hand.

[game-units-centimetres]
claim = """
The game files measure lengths in Unreal units, one centimetre each, and
speeds in centimetres per second. A player capsule 1.96 m tall and a 6.75 m/s
run fit that unit [domain:game_data/character-eye-height]
[domain:game_data/character-movement-speeds].
"""
kind = "geometry"
known = "cited"
since = "2026-10-04"
subject = "game files:units"
source = """
Unreal Engine documentation: one Unreal unit is one centimetre by default;
VALORANT is built on Unreal Engine (the export JSON carries engine class names
such as CharacterMovementComponent fields and UScriptClass). No VALORANT file
states the unit.
"""
use = "divide a game-file length by 100 for metres"
values = { units_per_m = 100.0 }
supersedes = """
[domain:movement/game-units-are-centimetres]: the unit, one game unit to the
centimetre and 100 to the metre; the navigation agent dimensions it gave are
in [domain:game_data/character-eye-height]
"""
see = ["game_data/character-eye-height", "game_data/character-movement-speeds"]

[character-movement-speeds]
claim = """
A player character's movement tuning sets a base top speed of 6.75 m/s (675.0
cm/s) and a top-speed multiplier per movement state, indexed by
EAresMovementType (0 Walking, 1 Running, 2 Jumping, 3 Crouching, 4 OnAscender,
5 Flying): walking 0.6, jumping 1.1, crouching 0.35, on a rope 0.5. The
running multiplier is not serialized in any class of the chain, so it is the
native default, unread here. With a running multiplier of 1 the top run speed
is 6.75 m/s; walking is then 4.05 m/s and crouching 2.3625 m/s, products of
the fields. A held weapon scales the run speed
[domain:game_data/weapon-run-speed-multipliers].
"""
kind = "measurement"
known = "measured"
since = "2026-10-04"
subject = "movement:speed"
source = """
release-13.06-shipping-18-5590001, set ability-states:
ShooterGame/Content/Characters/_Core/BasePlayerCharacter.uasset
CharMoveComp.MovementTuning.BaseValues.MaxSpeed = 675.0 cm/s,
.DefaultStateMultipliers.MaxSpeed = 0.6 (index 0),
.DefaultStateMultipliers[2].MaxSpeed = 1.1,
.DefaultStateMultipliers[3].MaxSpeed = 0.35;
ShooterGame/Content/Characters/_Core/BasePawn.uasset
CharMoveComp.MovementTuning.DefaultStateMultipliers[4].MaxSpeed = 0.5,
inherited by BasePlayerCharacter, the parent class of every agent's
<Codename>_PC. The index meaning is the usmap enum EAresMovementType of
VALORANT_13.06_zs.usmap; the weapons' MovementCurves (index 0 Walking, 1
Running, 3 Crouching, 4 Ascenders curve names) agree with it.
"""
use = """
the reach region's growth rate: the top run speed times the held weapon's multiplier
"""
exceptions = """
The array index is matched to EAresMovementType by its length and the curve
names, not by a declaration the export carries. The engine field
CharMoveComp.MaxWalkSpeed is 560 or 590 cm/s per agent (Breach_PC 560, Rift_PC
590, ...); the movement tuning governs Valorant's own movement, and which
field the native code reads is unread. Clove's Smonk_PC sets multiplier [5]
(Flying) to 3.0. Abilities that change speed (Stim Beacon, High Gear, Dismiss,
...) are not included.
"""
values = { speed = { base_max_speed_m_s = 6.75 }, state_multiplier = { walking = 0.6, jumping = 1.1, crouching = 0.35, on_ascender = 0.5 } }
supersedes = """
[domain:movement/character-max-speed]: its base top speed and state
multipliers, read from the same BasePlayerCharacter export of this build; this
fact names the 1.1 state Jumping, which that fact left unread
"""
see = ["game_data/game-units-centimetres", "game_data/weapon-run-speed-multipliers"]

