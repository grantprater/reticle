# The topological order of `reticle/`. DECLARED, never derived.
#
# A module may import from its own layer or any layer BELOW it. `doctor`'s
# LAYER check verifies the code agrees; it does not compute this file, and it
# does not accept a layering that has drifted -- an unplaced module, a phantom
# one, and an exception that no longer applies are all reported.
#
# Why declared rather than derived. The derived depth-by-longest-path puts
# `doctor`, `domain` and `decode` at the bottom beside `version`, because their
# real dependencies happen to be deferred inside functions. That is an accident
# of where imports sit, not a statement of design, and enforcing it would
# freeze the accident. This file states intent, and the intent is the pipeline
# spine `docs/WORKING_MAP.md` already names: raw observation -> adjudication ->
# lifecycle event -> compound episode -> review.
#
# Subpackages are placed by their DOTTED name. `reticle/adjudication/` was
# invisible to the check until 2026-09-11 -- a `*.py` glob cannot see a
# directory -- so four modules sat in no layer and `adjudication.ability`
# imported `ability_timeline`, an eager edge up into `entities`, unreported.
# The fix was to place the timeline where it belongs rather than to bless the
# edge: `ability_timeline` and `ability_coverage` are pure over stored
# observations, which is this file's definition of `adjudication`, and the
# `entities` entries left behind them are the command adapters.
#
# Schema and the checks: `reticle/architecture.py`. Who owns which QUESTION is
# a different matter and lives in `ownership.toml`.

[layers]
order = ["foundation", "source", "primitives", "readers", "orchestration",
         "adjudication", "entities", "consumers", "delivery"]

[foundation]
claim = "no siblings above the language and the store's own vocabulary"
modules = ["version", "profiles", "fingerprint", "metrics", "usage", "judgement",
           "domain", "architecture", "ownership", "quoted", "screen",
           "appearance", "artifacts", "revisions", "census", "events",
           "candidate_evidence", "documents", "entity_contract"]

[source]
claim = "identity, decode, persistence, and the baked (map, profile) geometry"
modules = ["decode", "store", "geometry", "input_stamps", "audio_source"]

[primitives]
claim = "per-frame primitives and the spans built from them"
modules = ["primitives", "segment", "stalls", "blinds", "synth"]

[readers]
claim = "pixels in, one observation out; no reader knows another"
modules = ["minimap", "ally_portrait", "ocr", "killfeed", "roster", "ping", "cone", "lighting",
           "hud_reader", "scoreboard", "scoreboard_strip", "round_outcome", "glance", "track", "economy",
           "minimap_dark", "combat_report", "ability_shapes", "tray", "ult_lines",
           "tray_icons", "menu", "teardrop", "spike", "occluders", "ability_scan", "ability_icons",
           "plant_graphic", "killfeed_numeral", "killfeed_assist", "stack_fit", "tray_countdown",
           "minimap_glyph", "clove_circle"]

[orchestration]
claim = "shared decode passes, which dispatch to readers and own no reading"
modules = ["passes", "pipeline", "trial", "roi_cache", "widget_frame", "dev_sample"]

[adjudication]
claim = "pure over stored observations, with evidence and alternatives"
modules = ["belief", "rounds", "checks", "reconciliation", "refinement",
           "refine", "minimap_diagnostics", "minimap_lifecycle",
           "round_lifetimes", "lineup", "barriers", "acquisition",
           "capabilities", "adjudication.ability", "adjudication.capture",
           "adjudication.gallery", "adjudication.phases", "adjudication.identity",
           "adjudication.death", "adjudication.weapon", "adjudication.killfeed_kits",
           "adjudication.scoreboard",
           "adjudication.minimap_candidates", "adjudication.smokes",
           "adjudication.combat_report", "adjudication.reliability",
           "adjudication.killfeed_names", "adjudication.ult_cast",
           "adjudication.ability_state", "adjudication.tray_kit", "adjudication.ability_audio",
           "adjudication.smoke_owner", "adjudication.spike_carrier", "adjudication.killstreak",
           "adjudication.ability_glyph",
           "adjudication.assist",
           "adjudication.round_outcome", "self_icon",
           "minimap_objects",
           "ability_coverage", "ability_candidates",
           "ability_timeline", "ability_audio_fit", "gametime", "domain_learning",
           "replay_source", "replay_actors", "replay_layer"]

[entities]
claim = "lifecycle events, compound episodes, review and coaching hypotheses"
modules = ["ability_capture", "ability_entities", "ability_gallery", "round_entities",
           "ability_phases", "coaching", "review", "overlay", "team_vision", "status",
           "fidelity", "doctor", "plan", "entity_events", "enemy_tracks", "retire"]

[consumers]
claim = "read only emitted events and stored rounds; call no reader, tracker or adjudicator, and decide nothing"
modules = ["view_events", "round_view"]
# The CONSUMER check (`architecture.verify_consumers`, docs/ENTITY_EVENTS.md
# section 4). `modules` above are the declared consumers; `review` may call
# `ledger`, as the round viewer does to draw withheld rows apart in amber.
review = ["view_events", "round_view"]
read_through = "entity_events"
forbidden_layers = ["primitives", "readers", "orchestration", "adjudication"]
forbidden_calls = ["read_events", "read_events_kind", "read_hud", "read_minimap",
                   "read_rounds", "read_roster", "read_primitives", "read_spans",
                   "read_candidates", "read_candidate_batch", "read_decisions",
                   "events_path", "read_table", "read_parquet", "ParquetFile",
                   "ParquetDataset"]
forbidden_imports = ["pyarrow.parquet", "duckdb"]

# Transitional exemptions. Stage 0 declared the viewer with the check; stage 1
# (2026-09-30) moved the round-entity, death and spike layers and the round
# table to `entity_events` and ended the `read_rounds` and `widget_frame`
# exemptions. The layers without a lane still read their streams' files.
[[consumers.exemption]]
module = "view_events"
uses = "call:events_path"
since = "2026-09-30"
until = "each remaining layer reads a projected lane (docs/ENTITY_EVENTS.md, stages 2-4)"
reason = "`read_rows` opens the events file of each stream no lane projects yet (team_vision, ability, smoke, ult_cast, ping, killfeed), and the `--gaps` census measures the owners' own streams."

[delivery]
claim = "the command surface, and nothing else may import it"
modules = ["cli", "__main__", "tiers", "clipserve"]

# ---------------------------------------------------------------------------
# Upward edges, blessed one at a time with the reason. `kind` says whether the
# import runs at IMPORT time or inside a function: an eager upward edge is a
# real inversion of the layering, a deferred one is a runtime call upward. Both
# are recorded, because a deferred import is how an inversion hides.
#
# An exception whose edge no longer exists is reported. That is the half that
# keeps this file from rotting upward into permissiveness: a declaration only
# ever verified can be satisfied by declaring everything.
# ---------------------------------------------------------------------------

[[exception]]
from = "store"
to = "roster"
kind = "eager"
imports = "N_SLOTS"
reason = """
A SCHEMA constant -- how many player slots a stored table has -- that happens
to live in a reader. The store depends on the number, not on the reading. Move
it to `version` or `foundation` and this edge goes away.
"""

[[exception]]
from = "refinement"
to = "review"
kind = "eager"
imports = "REVIEW_VERSION"
reason = """
A version stamp, for provenance, not behaviour. Same shape as the entry above:
the stamp belongs lower than the module that owns it.
"""

[[exception]]
from = "geometry"
to = "minimap"
kind = "deferred"
imports = "art_floor"
reason = """
`footprint` warps the art footprint through `minimap.art_floor`. Geometry owns
the artifact and minimap owns the shape of a floor, so the call is upward by
one layer for one function. Deliberate.
"""

[[exception]]
from = "decode"
to = "refine"
kind = "deferred"
imports = "merge_windows"
reason = """
Dense refinement asks decode for intervals, and decode asks refine how to merge
them. The merge rule is adjudication and belongs where it is.
"""

[[exception]]
from = "fidelity"
to = "cli"
kind = "deferred"
reason = """
`fidelity-check` opens media through the command surface it is invoked from.
The only edge here that points at `delivery`, and the reason it is tolerated is
that fidelity is a harness rather than a stage.
"""

[[exception]]
from = "trial"
to = "adjudication.minimap_candidates"
kind = "deferred"
reason = """
The `ally_icon` stream `scan` publishes is the accepted view of the reader's
candidates under the stored decision rule. A trial diffs the rows `scan` would
write, so it asks the rule's owner (`ally_decisions`, `accepted`) rather than
restating it; it writes nothing.
"""

[[exception]]
from = "minimap"
to = "widget_frame"
kind = "deferred"
imports = "turned_at"
reason = """
Portraits keep their on-screen orientation on a widget placed turned over, so
`ally_icon_reader` asks the placement's owner when the stored placement is
turned (`turned_at`) and the reader turns the aligned portrait back there, as
`self_icon` and `minimap_objects` do. A pure read of the manifest, one layer up,
for one function; the reader decides nothing about the placement.
"""

[[exception]]
from = "minimap"
to = "round_lifetimes"
kind = "deferred"
imports = "ROSTER_LAG_MS, ally_capacity, roster_window"
reason = """
The stacked-icon search runs only where the roster's alive teammates exceed
the frame's ring fits. `StackGate` asks the capacity rule's owner
(`ally_capacity` over `roster_window`) rather than restating it, and declares
the roster reads it rests on; it takes a count from the roster channel, never
a verdict on an icon.
"""

[[exception]]
from = "trial"
to = "lineup"
kind = "deferred"
imports = "portrait_candidates, glyph_candidates"
reason = """
The killfeed portrait reader scores each side's admitted agents from the stored
lineup, as `scan` builds it; the minimap glyph reader scores their kits. A
trial builds the reader `scan` would, so it asks the lineup's owner for that
candidate set rather than restating it; it writes nothing.
"""

[[exception]]
from = "trial"
to = "gametime"
kind = "deferred"
imports = "live_phase_at"
reason = """
The ability pass reads only live samples, gated by the stored game time's
phase. A trial of the glyph reader builds the icon reader `scan` would, so it
asks the gate's owner (`live_phase_at`, which `scan` calls too) rather than
restating it; it writes nothing.
"""

# ---------------------------------------------------------------------------
# The tree direction. `reticle/` does not know `prototypes/` exists.
# ---------------------------------------------------------------------------

[trees]
claim = """
`reticle/` must not import `prototypes/`. A prototype may import `reticle`; the
reverse makes a shipped module depend on something with no version stamp, no
tests, and no promise to keep working.
"""
auditor = ["doctor"]
allow = ["ability_timeline"]
allow_reason = """
`doctor` is the auditor and may reach both trees by any spelling -- a checker
that can only see one side of a fork cannot see a fork. It mostly reads them as
FILES, which no import rule can see or should; `check_shade` and its neighbours
import after a `sys.path` insert, and that spelling is exactly why the check
counts a bare import of a prototype module and not only a
`prototypes.`-prefixed one.

`allow` is NOT a blessing: it excuses plain imports only, `verify` reports each
on every run, and a `sys.path` change or `importlib` load naming the tree is an
ERROR for every module but an auditor. `ability_timeline` reaches into
prototypes because the calibration still lives there, an unfinished promotion
rather than a design: `materialize_demo_casts` drives `ability_cast` and
`ability_hud` as readers, triaged in BACKLOG.md under the ability line.
`lineup` sat here too, inserting the prototypes directory on `sys.path` for
`minimap_portrait.composition`, and the allowance silenced the check; the
histogram moved to `appearance.portrait_composition` (2026-10-04).
"""
