[[entry]]
id = "replay-tables"
question = "What does a kept replay hold of its match, per tick and per event, on the capture's clock and minimap?"
owner = "replay_layer"
role = ["track", "attribute"]
status = "partial"
produces = ["build", "load", "Layer", "status", "session_status", "current_inputs",
            "lives_table", "round_table", "cast_crosscheck", "rpc_calls",
            "REPLAY_LAYER_VERSION", "HELD_OUT", "SOURCES"]
consumers = ["cli", "plan", "doctor"]
not_for = """
Anything shown during play, and any reader's or adjudicator's input: the layer
is external truth under the use policy (docs/EXTERNAL_GROUND_TRUTH.md). Its
agent names come from the replay's playerLoadouts and never enter
`agent-identity`; its slot keys rest on the lineup's resolved verdicts and say
so. It decodes no video and fits nothing: the clock and the map transform are
`replay-alignment`'s, the actor-to-ability mapping `replay-ability-actors`'s.
The held-out match is built and never summarised.
"""
defers_to = ["replay-alignment", "replay-self", "replay-ability-actors"]
evidence = "tests/test_replay_layer.py, docs/REPLAY_LAYER.md"

[[entry]]
id = "replay-truth-under"
question = "Which replay entity lies under a vision find?"
owner = "acceptance"
role = ["assign"]
status = "partial"
produces = ["summarize_rows", "step_summary", "pool_classes", "boot_pooled", "ACCEPTANCE_VERSION"]
not_for = """
Reader inputs. Replay data is evaluation truth only: it scores a find and
never feeds a reader, a gate, a threshold, a prior or an adjudicator; the
`evaluation` layer sits above every pipeline layer, so none may import it.
Nor is it whether the find is real (`detection-reality`) or which agent it
names (`agent-identity`); it states which truth entity, of any class, a find
lies on, for scoring alone (AGENTS.md, "Replay truth covers every entity").
The limit, and why the join waits: the core is pure over a truth grid its
caller builds, and the grid with its T1d draw rule
(`t1_draw_rule.RealDrawMatch`, `enemy_lane_check.build_sets`) is still a
prototype. Only `prototypes/question_acceptance.py` (lane, label, the
steps, replay-score, replay-abilities, budget) builds the grid and calls the
join (`join_entities`, `truth_under_rows`, `score_finds`, `class_lane`,
`score_lane`, `mark_truth`, `census`, `assign_per_frame`); `reticle
acceptance` runs only `summary`, in process over the stored rows. No
`reticle/` command reaches the join until the grid is promoted, so
`produces` names only what `summary` reaches.
"""
evidence = "tests/test_acceptance_core.py"
