# Who owns each piece of information. DECLARED, never derived.
#
# One entry per QUESTION, because the question is what a developer arrives
# with; the module is the destination, not the organizing idea. `reticle`
# `ownership` routes a plain-language question to its owner, and `doctor`'s
# OWNERSHIP check verifies every claim here against the code: the owner exists,
# it defines what this says it produces, it CLAIMS the entry in its own
# docstring with an `[owns:id]` token, its `defers_to` imports still exist, and
# every module in `reticle/` either owns an entry or is declared
# infrastructure.
#
# Why declared rather than derived. Ownership cannot be read off the import
# graph -- that graph is exactly how the confusion arises. `minimap_lifecycle`
# imports `track`, which says nothing about which of them owns the motion law,
# and the two silently owned it together until they disagreed by a factor of
# two. Deriving ownership from imports would have blessed that.
#
# `not_for` is the field to read second. The negative boundary is what stops a
# module being selected because its NAME matched, and every one of them below
# is a mistake the repo has already made or nearly made.
#
# Schema and the checks: `reticle/ownership.py`. The layering is a different
# question and lives in `architecture.toml`; what is true of the GAME lives in
# `domain/*.toml`.

# ---------------------------------------------------------------------------
# Source, schema, and the baked map
# ---------------------------------------------------------------------------

[[entry]]
id = "source-identity"
question = "Which media is this row from?"
owner = "fingerprint"
role = ["assign"]
status = "shipped"
produces = ["content_key", "SourceFingerprint"]
not_for = """
Anything inside the frame. `identity` here means PROVENANCE -- which file, which
session -- and an entity-identity task routed here is routed wrong.
"""
stored_consumers = ["store"]

[[entry]]
id = "extraction-profile"
question = "Which ROI layout and widget scale does this source use?"
owner = "profiles"
role = ["constrain"]
status = "shipped"
produces = ["get_profile", "Profile"]
not_for = """
The content found in any ROI, and the map. A profile is a capture layout; it is
not a map, not a widget reading, and not the player's point of view.
"""
consumers = ["minimap", "killfeed", "ocr", "roster", "primitives", "overlay"]

[[entry]]
id = "map-geometry"
question = "What is the floor, terrain and reference art for this (map, profile)?"
owner = "geometry"
role = ["constrain"]
status = "shipped"
produces = ["reference_for_key", "key_of", "path_of", "MapScale", "map_scale", "map_scale_of", "SCALE_REF_KEY"]
not_for = """
Anything a session's own pixels say. SESSION PIXELS DO NOT DEFINE THE MAP: a
capture determines the widget's size, placement and orientation and nothing
else, and a reader building its own static map from a capture median is the
fault `doctor`'s SESSION_STATIC check exists for.
"""
consumers = ["barriers", "status", "cone", "doctor"]
evidence = "tests/test_geometry.py, tests/test_floor_stability.py"

[[entry]]
id = "map-occluders"
question = "Which pixels of this (map, profile) are full-height walls, which are boxes a ray may pass over, and how tall is each box?"
owner = "occluders"
role = ["constrain"]
status = "partial"
produces = ["bake", "classify", "apply_lines", "read_lines", "lines", "seal_diagonals", "static_sha", "occluder_stamp"]
not_for = """
Whether a ray passed a box on a given frame: `cone.box_crossings` says where a
pass would show and the drawn light decides. Not elevation, which the map art
carries as `shade_step`. Not anything a session's own pixels say: it reads the
key's baked static, the geometry builder's one capture-derived array. Not which
class a drawn line is: prototypes/line_classes.py bakes that (`line_cls`), and
this reads it. Not a box's height beyond the hints the player's notes and
domain/heights give; every other box is unknown.
"""
consumers = ["doctor", "cli"]
stored_consumers = ["team_vision", "barriers"]
evidence = "tests/test_cone_walls.py, tests/test_occluder_lines.py"

[[entry]]
id = "minimap-widget-frame"
question = "Where does this session draw its minimap widget relative to the baked geometry, and is it a variant?"
owner = "widget_frame"
role = ["constrain"]
status = "shipped"
produces = ["fit_crop", "for_session", "cohort", "capture_box"]
not_for = """
Any map value. The fit measures the widget's scale, rotation and placement
against the baked static and nothing else; the floor, lighting and base map
still come from `map-geometry`. Not the icons drawn on the widget either.
"""
consumers = ["roi_cache", "status", "cli"]
evidence = "tests/test_widget_frame.py"

[[entry]]
id = "domain-fact"
question = "What is true of VALORANT itself, rather than of this pipeline?"
owner = "domain"
role = ["constrain"]
status = "shipped"
produces = ["load", "Fact", "citations", "restatements"]
not_for = """
This pipeline's own accuracy. A fact whose truth depends on a detector version
is an outcome and belongs in `notes/predictions.jsonl` and `metrics`.
"""
consumers = ["doctor"]
evidence = "tests/test_domain.py, `reticle domain --check`"

[[entry]]
id = "domain-hypothesis"
question = "Does stored evidence independently support a proposed domain fact?"
owner = "domain_learning"
role = ["adjudicate"]
status = "shipped"
produces = ["validate", "publish", "render"]
not_for = "Accepted domain facts, entity identity, track association, or automatic promotion. The canonical fact owner is domain."
evidence = "tests/test_domain_learning.py, tools/domain_hypothesis.py"

# ---------------------------------------------------------------------------
# Per-frame evidence, before anything interprets it
# ---------------------------------------------------------------------------

[[entry]]
id = "frame-primitive"
question = "What cheap, deterministic evidence does this frame carry?"
owner = "primitives"
role = ["detect"]
status = "shipped"
produces = ["PrimitiveExtractor", "frame_columns", "hamming"]
not_for = """
Entity classes, track identity or events. This is the evidence-before-
interpretation boundary, and adjudication placed here is adjudication nothing
can later disagree with.
"""
stored_consumers = ["segment", "stalls"]

[[entry]]
id = "evidence-span"
question = "Over which contiguous spans does a per-frame signal hold?"
owner = "segment"
role = ["lifecycle"]
status = "shipped"
produces = ["to_spans", "classify", "SegmentConfig"]
not_for = """
An entity's lifetime. These are SOURCE spans over a stored column; an entity
existing from one origin event to a terminal state is `round-entity`, and the
shared word is the whole reason to say so here.
"""
consumers = ["synth"]

[[entry]]
id = "capture-stall"
question = "Are these frames a stalled capture rather than observations?"
owner = "stalls"
role = ["constrain"]
status = "shipped"
produces = ["spans", "for_session", "stalled_at"]
not_for = """
Channel-specific absence. A stall says the SOURCE repeated, not that an entity
died, a widget vanished or a reader refused -- every reader joins this fact
rather than deciding on its own that a missing observation means death.
"""
consumers = ["doctor", "team_vision"]
evidence = "tests/test_stalls.py"

# ---------------------------------------------------------------------------
# Readers: pixels in, one observation out
# ---------------------------------------------------------------------------

[[entry]]
id = "widget-drawn"
question = "Is the minimap widget drawn in this frame at all?"
owner = "minimap"
role = ["detect"]
status = "partial"
produces = ["widget_drawn"]
not_for = """
A refusal. An absent widget and a reader that would not commit are different
states and must stay distinguishable; both currently arrive downstream as
`self_x = NULL`, which is the open defect BACKLOG.md names.
"""
consumers = ["belief"]

[[entry]]
id = "self-position"
question = "Where is the local player's icon on the minimap?"
owner = "minimap"
role = ["detect"]
status = "partial"
produces = ["pick_self", "self_icons", "filter_track", "self_portrait_pixels"]
not_for = """
WHICH AGENT the player is. `pick_self` answers a spatial question and the name
is the trap: semantic self is `player-agent`, owned by `lineup`. The fit can
also land on the carried spike, so an accepted position is not an accepted
identity.
"""
consumers = ["belief", "track", "lighting", "minimap_diagnostics", "team_vision"]
evidence = "tests/test_pick_self.py, prototypes/xmark_eval.py"

[[entry]]
id = "spike-observation"
question = "Where is the spike glyph on the minimap, is it on the ground or carried, and which roster slot carries the spike marker?"
owner = "spike"
role = ["detect"]
status = "partial"
produces = ["glyph_fits", "accepted", "on_glyph", "carrier_offset", "roster_marker", "read_frame"]
not_for = """
Naming the carrier: the marker's slot is the roster bar's packed position, and
the agent in it is `agent-from-slot`'s answer. Nor the planted spike, whose
state the rounds table owns (`rounds.spike_planted`), nor the orange and black
spike appearances the player has not yet named, which it keeps as candidates.
"""
consumers = ["cli", "self_icon", "minimap", "adjudication.minimap_candidates",
             "adjudication.spike_carrier"]
evidence = "tests/test_spike.py"

[[entry]]
id = "spike-carrier"
question = "Do the roster marker, the minimap carried glyph, the plant and the alive count agree about who carries the spike?"
owner = "adjudication.spike_carrier"
stored_consumers = ["entity_events"]
role = ["adjudicate"]
status = "partial"
produces = ["check", "frame_state"]
defers_to = ["spike-observation"]
not_for = """
Naming the carrier, which each row defers to `agent-from-slot` through
`depends_on`; timing the plant, which `rounds` owns; or reading the "SPIKE
CARRIER KILLED" banner, which no channel reads yet. It stores disagreements
and resolves none.
"""
consumers = ["cli"]
evidence = "tests/test_spike.py"

[[entry]]
id = "ally-candidates"
question = "Which minimap blobs could be a teammate this frame?"
owner = "minimap"
role = ["detect"]
status = "partial"
produces = ["ally_icons", "ally_rings", "ally_icon_descriptors", "AllyIconReader"]
not_for = """
Stable ally identity. These are per-frame candidates sorted by blob area, and
nothing claims slot 0 is the same player between frames. Two icons may also be
exactly coincident [domain:minimap/coincident-icons], so one candidate never
excludes another's region.
"""
consumers = ["round_lifetimes", "minimap_diagnostics", "team_vision"]

[[entry]]
id = "minimap-dark"
question = "Which minimap floor pixels does something grey and opaque cover this frame, and which can an icon hide?"
owner = "minimap_dark"
role = ["detect"]
status = "partial"
produces = ["grey_dark", "occluded", "DarkRegionReader", "dark_reader"]
not_for = """
Deciding what covers the floor or how long it lasts; that is
`adjudication.smokes`. Enemy smokes, which are not drawn
[domain:abilities/enemy-smokes-not-on-minimap], and coloured marks, which the
grey gate excludes by design.
"""
consumers = ["cli"]
stored_consumers = ["adjudication.smokes"]

[[entry]]
id = "minimap-smoke"
question = "Where and when is a smoke drawn on the player's minimap?"
owner = "adjudication.smokes"
role = ["adjudicate", "lifecycle"]
status = "partial"
produces = ["tracks", "events"]
not_for = """
Which agent cast the smoke (`smoke-owner`), enemy smokes (only
missing cone light shows them [domain:minimap/enemy-smokes-block-cones]), and
non-disc abilities. An end marked censored is an interval, not a time.
"""
consumers = ["cli"]
evidence = "tests/test_smokes.py"

[[entry]]
id = "smoke-owner"
question = "Which ally agent cast this minimap smoke?"
owner = "adjudication.smoke_owner"
role = ["attribute", "adjudicate"]
status = "partial"
names_agents = true
produces = ["adjudicate", "lifetime_verdict", "tray_verdict", "cast_groups",
            "tolerance_s", "window", "SMOKE_ABILITY", "NO_BULK", "LIFETIME_S",
            "CAST_WINDOW_S", "NOT_A_PLAYER_CAST", "CHANNELS", "player_smoke_casts",
            "smoke_entity_id"]
not_for = """
Finding or timing the smoke (`minimap-smoke`), enemy smokes (not drawn on the
player's minimap), or deciding a name itself: each rule is a claim through
`agent-identity`, declaring `depends_on` the lineup's ally slots, and a track's
agent is the arbiter's verdict. Nor is it for deciding which tray drops are the
player's casts (`ability-cast`). A smoke agent without a measured disc lifetime
or cast window has no rule, and none is borrowed from another ability.
"""
defers_to = ["agent-identity", "ult-cast", "ability-cast"]
consumers = ["cli"]
evidence = "tests/test_smoke_owner.py"

[[entry]]
id = "combat-report-read"
question = "What does the combat report panel show in this frame: its header score, and per row the damage each way, the hit splits and the flag words?"
owner = "combat_report"
role = ["detect"]
status = "partial"
produces = ["CombatReportReader", "locate", "read_rows", "read_number", "read_hits", "read_flag", "load_templates", "field_at"]
not_for = """
Which panel or round a frame belongs to, or what the flags mean for kills and
deaths; that is `adjudication.combat_report`. Row names, portraits and the
KILLED BY header are not read yet, and no agent name is produced.
"""
consumers = ["cli"]
stored_consumers = ["adjudication.combat_report"]

[[entry]]
id = "combat-report-round"
question = "How many kills, deaths and assists did the player get in each round, by the combat report where it was shown and the killfeed otherwise, and which panels and rounds does that rest on?"
owner = "adjudication.combat_report"
role = ["adjudicate"]
status = "partial"
produces = ["episodes", "panels", "assign_rounds", "round_counts", "events", "frame_read", "portrait_clusters", "scoreboard_bound", "name_rows", "round_verdicts", "bind_deaths", "ally_bound"]
names_agents = true
defers_to = ["agent-identity"]
not_for = """
Rewriting the stored rounds' killfeed counts: the verdict is a separate
product with its source, and the killfeed count stays beside it. Deciding a
row's agent: `name_rows` publishes claims keyed by portrait cluster and the
name is `adjudication.identity`'s verdict. Which agent killed the player (`death-victim`), and damage
decomposition by weapon, which stays in `prototypes/combat_report.py`.
"""
consumers = ["cli", "status", "coaching"]
evidence = "tests/test_combat_report.py"

[[entry]]
id = "minimap-icon-disposition"
question = "Which fitted minimap player-icon candidates survive shape, facing, overlap and map-interior decisions?"
owner = "adjudication.minimap_candidates"
role = ["adjudicate"]
status = "partial"
produces = ["ally_decisions", "accepted"]
not_for = """
Generating fitted hypotheses from pixels, binding an agent name, or deciding
whether a surviving icon continues a round lifetime.
"""
consumers = ["cli"]
stored_consumers = ["round_entities"]
evidence = "tests/test_candidate_evidence.py"

[[entry]]
id = "portrait-descriptor"
question = "What does this crop of agent art look like, as one comparable vector?"
owner = "appearance"
role = ["detect"]
status = "shipped"
produces = ["hsv_composition", "detail", "agrees", "ArtTiles", "killfeed_art", "art_zncc", "to_lab", "ART_INNER_MARGIN"]
not_for = """
Naming the agent, and replacing `lineup`'s feature. This is a DESCRIPTION; the
gallery that would turn one into a name is built with the prototype composition
in `lineup`, and the two are not interchangeable. Unmasked it describes the
furniture a portrait is drawn on rather than the portrait.
"""
consumers = ["killfeed", "scoreboard"]

[[entry]]
id = "ally-portrait-features"
question = "What does this minimap ally portrait look like, and what does each agent's minimap art look like at icon size?"
owner = "ally_portrait"
role = ["detect"]
status = "partial"
produces = ["portrait_features", "align_icon", "stored", "render", "render_reference", "build_references", "load_references"]
not_for = """
Naming the agent: `adjudication.identity` scores these features against the
rendered references. Nor for fitting the calibration it renders under; that is
`prototypes/ally_portrait_calibration.py`, stored beside the table with its
provenance. The references are rendered from art, never from a session.
"""
consumers = ["minimap", "adjudication.identity", "cli"]
evidence = "tests/test_ally_icons.py"

[[entry]]
id = "killfeed-portrait"
question = "What do the killer and victim portraits in this entry look like?"
owner = "killfeed"
role = ["detect"]
status = "partial"
produces = ["portrait_observations", "PORTRAIT_ASPECT", "KILLFEED_PORTRAIT_VERSION", "KillfeedPortraitReader", "art_view", "ART_TILE_H", "ART_VICTIM_OUTER", "ART_SURPRISE_Z"]
not_for = """
Naming either agent, and being believed one frame at a time. The descriptors plus
the plate's side are all a reader may emit. The art ZNCC scores the side's
admitted agents (`lineup.portrait_candidates`), a candidate set and never a
verdict; the claim that names from it is `adjudication.identity`'s, so the
lineup's conclusion never becomes this reader's. Nor is one frame an answer: over 12 consecutive frames of one entry
the top match changes at least once on a fifth of them, while 92.5% of frames
agree with their own entry's majority. Accumulate over the entry's lifetime, as
`lineup` accumulates over a session. See `agent-identity`.
"""
defers_to = ["portrait-descriptor"]
evidence = "tests/test_killfeed_portraits.py"

[[entry]]
id = "killfeed-weapon-descriptor"
question = "What does the icon in this killfeed entry's weapon slot look like?"
owner = "killfeed"
role = ["detect"]
status = "partial"
produces = ["KILLFEED_WEAPON_VERSION", "ICON_WHITE_V_MIN", "ICON_WHITE_S_MAX", "ICON_GRID", "icon_white_mask", "icon_grid", "weapon_icon_observations", "unpack_icon_grid", "icon_extent", "ELEMENT_GAP", "PLATE_WHITE_CUT", "PLATE_MIN_PX", "PLATE_FILL", "PLATE_BEHIND_MIN", "plate_colour", "plate_whiteness", "slot_white_mask", "RING_R", "RING_ANGLES", "RING_TOL", "RING_COVER_MIN", "RING_INNER_MAX", "RING_ABSENT_MAX", "RING_STRIP", "ring_fit", "ring_verdict", "SOFT_MARGIN", "soft_patch"]
not_for = """
Naming the weapon or ability. The reader stores the white mask's normalised grid,
the slot's soft whiteness patch at native size,
its aspect and the slot's box, one row per entry per frame, in the
`killfeed_weapon` stream; `adjudication.weapon.entry_weapon` binds rows to an
entry and names them from storage.
"""
consumers = ["adjudication.weapon"]
stored_consumers = ["adjudication.death"]

[[entry]]
id = "killfeed-name-descriptor"
question = "What does the player name in this killfeed entry role look like?"
owner = "killfeed"
role = ["detect"]
status = "partial"
produces = ["KILLFEED_NAME_VERSION", "NAME_MAX_TEXT_H", "NAME_TEXT_SHARE", "NAME_MIN_W", "NAME_WORD_GAP", "name_observations", "unpack_name_gray"]
not_for = """
Deciding which roles share a name, or naming a player or agent. The reader
stores the whole name's whiteness crop, one row per entry role per frame, in the
`killfeed_name` stream; `adjudication.killfeed_names` joins roles into name
clusters and `adjudication.identity` names them.
"""
consumers = ["adjudication.killfeed_names"]
stored_consumers = ["adjudication.death"]
evidence = "tests/test_killfeed_names.py"

[[entry]]
id = "killfeed-name-continuity"
question = "Which killfeed entry roles in one match print one player's name?"
owner = "adjudication.killfeed_names"
role = ["assign"]
status = "partial"
produces = ["KILLFEED_NAME_CLUSTER_VERSION", "NCC_MIN", "TOPHAT", "WIDTH_TOL", "ncc", "followed_views", "role_crops", "self_entry", "name_clusters"]
not_for = """
Naming the cluster's agent: a cluster is a set of entity ids, and
`identity.name_cluster_claims` assigns each side's large clusters its agents.
Nor for choosing the views an entry is read at; those are the portrait views
`adjudication.death` followed the entry through.
"""
defers_to = ["killfeed-name-descriptor"]
consumers = ["adjudication.death"]
evidence = "tests/test_killfeed_names.py"

[[entry]]
id = "killfeed-second-life-badge"
question = "Does this killfeed entry carry the circular second-life badge (Run It Back, a downed KAY/O)?"
owner = "killfeed"
role = ["detect"]
status = "partial"
produces = ["detect_second_life_badge", "fit_arc", "SECOND_LIFE_RUN_MIN"]
not_for = """
Deciding whether a death was a second life; that is
`adjudication.death.second_life_death`, a vote over the stored reads. Only the
player's own death entries are read today.
"""
consumers = ["adjudication.death"]
stored_consumers = ["rounds"]

[[entry]]
id = "killfeed-event"
question = "Did a kill appear in the feed, and did it involve the local player?"
owner = "killfeed"
role = ["detect", "attribute"]
status = "shipped"
produces = ["analyse_killfeed", "read_killfeed", "EntryView"]
not_for = """
Naming an arbitrary victim. The feed states a TEAM through the plate colour and
the local player through the literal string "Me"; an agent name for either side
needs the roster and lineup channels, and that owner does not exist yet --
see `death-victim`.
"""
consumers = ["checks", "hud_reader", "rounds", "overlay"]
evidence = "tests/test_killfeed.py, tests/test_entry_persistence.py"

[[entry]]
id = "scoreline"
question = "What do the score and the bottom HUD read this frame?"
owner = "ocr"
role = ["detect"]
status = "shipped"
produces = ["read_scoreline", "read_bottom_hud", "segment_glyphs"]
not_for = """
Player identity, and confidence in a reading. OCR confidence is evidence
QUALITY; a transient leading `1` on a scoreline stays an OCR finding rather
than becoming a score two channels then have to disagree about.
"""
consumers = ["hud_reader", "scoreboard", "overlay"]

[[entry]]
id = "scoreboard-row"
question = "What does a scoreboard row say, and which row is the local player?"
owner = "scoreboard"
role = ["detect", "attribute"]
status = "partial"
produces = ["read_scoreboard", "ScoreboardRead", "portrait_observations", "strip_rect",
            "table_columns", "reader_roi"]
not_for = """
Cross-round player identity. Rows compact and reorder, so a row POSITION is not
a player; the marked local row is the only attribution this owns.
"""
evidence = "tests/test_scoreboard.py, docs/SCOREBOARD_PRESENCE.md"

[[entry]]
id = "scoreboard-strip"
question = "Is the Tab scoreboard on screen at this cached frame, by its round-history strip?"
owner = "scoreboard_strip"
role = ["detect"]
status = "partial"
produces = ["read_strip", "strip_events"]
not_for = """
Reading a row, naming an agent, or deciding when the board opened. The strip is
one presence witness; `scoreboard-presence` reconciles it with the slab test.
The circles it counts as marks are round outcomes, which it does not read.
"""
consumers = ["cli", "scoreboard"]
stored_consumers = ["adjudication.scoreboard"]
evidence = "tests/test_scoreboard_strip.py, docs/SCOREBOARD_PRESENCE.md, prototypes/scoreboard_strip.py"

[[entry]]
id = "planted-spike-graphic"
question = "Does the scoreline's clock field show the planted-spike graphic at this cached frame?"
owner = "plant_graphic"
role = ["detect"]
status = "partial"
produces = ["read_field", "shows_graphic", "graphic_events", "stored_reads"]
not_for = """
Deciding that a round was planted, or when: `round-bounds` owns the plant and
cross-references these samples with the unread clock. Nor the minimap's planted
spike, a defuse, or a plant after the round was decided, which the scoreline
does not draw.
"""
consumers = ["cli", "rounds", "status"]
evidence = "tests/test_plant_graphic.py"

[[entry]]
id = "hud-scan"
question = "What does one shared HUD decode pass see in this frame?"
owner = "hud_reader"
role = ["detect"]
status = "shipped"
produces = ["HudReader"]
not_for = """
Adjudicated killfeed events. A shared extraction is an execution optimization,
and its output must stay distinguishable from what `killfeed` concluded.
"""
evidence = "tests/test_hud_reader.py"

[[entry]]
id = "alive-count"
question = "How many players are alive on each side right now?"
owner = "roster"
role = ["count", "detect"]
status = "shipped"
produces = ["alive_counts", "slot_details", "resolve"]
not_for = """
WHICH AGENT occupies a slot. The bars pack survivors toward one edge, so a slot
index is a position among the LIVING and not a player: the HUD death signal dims
a packed index and, read as identity, named the wrong victim in both rounds it
was tested on. The packed sequence is the INPUT to assignment, never the answer.
"""
consumers = ["lineup", "reconciliation", "coaching", "store"]
evidence = "tests/test_roster_identity.py"

[[entry]]
id = "ping-event"
question = "Is this mark a ping, which kind, and when did it appear?"
owner = "ping"
role = ["detect", "group"]
status = "partial"
produces = ["classify", "sightings", "Grouper"]
not_for = """
Player identity, or any static object. `static` motion is a CONSTRAINT a ping
satisfies, not proof that a static object is one.
"""
consumers = ["track"]

[[entry]]
id = "drawn-light"
question = "Which minimap pixels does the team's drawn light call lit?"
owner = "lighting"
role = ["detect", "constrain"]
status = "partial"
produces = ["lit_mask", "raw_lit", "clean_lit", "pack_mask", "unpack_mask", "reference", "Lighting"]
not_for = """
Visibility truth, or confirmation. Light can REFUSE an entity and cannot
confirm one, and unknown is not dark [domain:minimap/vision-gate].
"""
consumers = ["cli", "adjudication.ability", "team_vision"]
evidence = "tests/test_lighting.py"

[[entry]]
id = "viewcone"
question = "What does the geometric raycast say the player can see?"
owner = "cone"
