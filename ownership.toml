# ---------------------------------------------------------------------------
# Replay truth: a kept replay on the capture's clock and map
# ---------------------------------------------------------------------------

[[entry]]
id = "replay-alignment"
question = "How does a kept replay's clock and world map onto a capture's clock and minimap pixels?"
owner = "replay_source"
role = ["assign"]
status = "partial"
produces = ["Replay", "Reference", "capture_replay_context", "fit_alignment", "match_times",
            "MapFrame", "map_frame_for_geometry", "to_px", "facing_px_deg",
            "frames_to_replay", "riot_records", "replay_entry",
            "stored_deaths", "split_deaths", "MINIMAP_LAG_MS"]
consumers = ["replay_actors", "replay_layer"]
not_for = """
Reading pixels, and naming agents in the capture. The replay's playerLoadouts
name each replay player's agent as external truth; that name is never an
`identity_claim`, never pooled into `agent-identity`, and never shown during
play (the use policy, docs/EXTERNAL_GROUND_TRUTH.md). The clock offset rests
on the stored deaths, so a death rerun moves it; it is fitted, never read off
a reader's output as independent evidence of that reader.
"""
evidence = "tests/test_replay_truth.py, tests/test_riot_ground_truth.py"

[[entry]]
id = "replay-self"
question = "Which replay player is the capturing player, and which replay players are his teammates?"
owner = "replay_source"
role = ["assign"]
status = "partial"
produces = ["decide_player", "replay_self_pick", "choose_self_subject", "ally_icon_self_track",
            "living_widget_px", "spawn_teams", "same_side", "identify_player", "SELF_ID_RADIUS_M",
            "SELF_ID_MIN_FRAMES", "SELF_ID_MIN_SHARE", "SELF_ID_MARGIN", "SELF_ID_RESTS_ON"]
consumers = ["replay_layer"]
not_for = """
Who the player is during play, and which agent he plays: the lineup reader and
`agent-identity` name agents, and nothing here is shown during play (the use
policy, docs/EXTERNAL_GROUND_TRUTH.md). Riot's record decides where it names
the player; the replay's pick on the stored `ally_icon` self track is then a
cross-check, stored with its agreement. Without a Riot player the pick decides
and `rests_on` `ally_icon.self`, so a self fit scored against that replay is no
independent test of `ally_icon`. Teams without Riot are spawn groups `A`/`B`,
never Riot's team ids.
"""
evidence = "tests/test_replay_self.py"

